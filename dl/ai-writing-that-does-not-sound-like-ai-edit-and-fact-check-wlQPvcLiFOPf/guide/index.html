<script>const D={"handoff": [["Copy","Tap Copy prompt. The whole prompt is now on your clipboard."],["Open","Open the AI assistant you already use, for example ChatGPT, Claude, Gemini or Microsoft Copilot, and start a new chat."],["Paste and send","Paste the prompt into the message box and send it."],["Refine","If the AI asks a question, answer it with a confirmed fact. If the draft is too long or the tone is off, use a repair instruction."],["Check","Compare the answer with your own records using the checklist. Do not rely on the AI saying it is confident."],["Use","Copy the checked text into your email, chat, invoice note or document yourself. This guide never sends anything for you."]],"privacy": "Anonymize first: remove names, emails, phone numbers, addresses and order or account numbers before pasting anything into an AI assistant. Sharing as little customer personal data as possible is good practice under GDPR and similar privacy rules. Prompts you paste into an external AI assistant are handled by that service under its own terms and settings. This guide does not send your prompts anywhere; it only prepares the text for you to copy.","verify": "Check every name, number, date, price and policy against your own records (the invoice, quote, policy text or booking system). Asking the AI “are you sure?” or “how confident are you?” is not verification: it can sound sure and still be wrong.","repairs_general": [["Wrong or invented fact","Replace this assumption with the following confirmed fact: [FACT]. Change nothing else."],["Promise you can't keep","Remove any promise about [REFUNDS / STOCK / DELIVERY / DISCOUNTS]. We have not confirmed that."],["Missing information","You assumed [X]. Do not guess. Leave a gap marked [TO CONFIRM] instead."],["Too long","Cut this to [NUMBER] words. Keep the key message and every confirmed fact."],["Wrong tone","Rewrite in a [WARMER / MORE FORMAL / FIRMER] tone. Keep the facts exactly as they are."],["Wrong language","Rewrite this in [LANGUAGE]. Keep names, numbers and dates exactly as written."],["Too generic","Use my details: [PASTE FACTS]. Remove anything that could apply to any business."]],"profile_note": "Optional: save your business description, preferred tone and preferred reply language on this device so they are filled in next time. They are stored only in this browser on this device, not on our servers. Your task answers are never saved. You can remove everything at any time with Forget my details and saved prompts.","order": ["Complete the first win using a fictional example.","Choose a real task from the guided options.","Answer a few short questions with your confirmed facts, one at a time.","Copy the completed prompt and use it in your AI assistant.","Check the result with the task's checklist and repair it if needed.","Use the checked result yourself, and optionally save your business details on this device.","Explore the prompt library and the PDF for more."],"meta": {"web_title": "AI writing that doesn't sound like AI: edit and fact-check your drafts","demo_title": "Try it: fact-check and edit a fictional garden designer's AI-written About paragraph","demo_intro": "Walk through one complete fictional example: a small garden design studio whose AI draft claims awards, a guarantee and years of experience it doesn't have. See how a fact-check pass catches each claim, how the rewrite keeps only confirmed facts, then check the result. Takes about 5 minutes.","demo_pitch": "The full guide covers the tells that make writing sound like AI, editing in the right order, the fact-check pass, cutting filler, making copy specific without inventing details, a worked example and rewrites that keep your meaning, plus guided tasks, repair prompts, an edit checklist and the PDF.","description": "Turn stiff AI drafts into clear copy you can stand behind: a fact-check pass, an edit checklist and rewrite prompts that keep your meaning. A free Coaching Codex walkthrough.","slug": "ai-writing-that-does-not-sound-like-ai-edit-and-fact-check","title": "AI Writing That Does Not Sound Like AI: Edit and Fact-Check","storage": "cc.ai-writing-that-does-not-sound-like-ai-e"},"first_win": {"label": "Fictional example","step1_title": "The draft and the facts","intro": "Dana runs a made-up garden design studio. AI wrote her About paragraph, claiming awards, a guarantee and 15 years of experience. She asks AI to check every claim against her facts before rewriting. Nothing here is real or live AI output.","inputs": [["Business","Fernhill Garden Design (fictional), owner Dana, Portland, Oregon"],["AI draft","\"In today's fast-paced world... award-winning gardens that are guaranteed to thrive... over 15 years of experience...\""],["Confirmed facts","Small yards; since 2019; yard walk-around first; seasonal planting plan; no awards; no guarantee"],["Length","US English, under 70 words"]],"prompt": "Here is an AI draft of my website's About paragraph (fictional practice example):\n\"In today's fast-paced world, your outdoor space deserves more. At Fernhill Garden Design, we delve into every detail to craft award-winning gardens that are guaranteed to thrive. Moreover, with over 15 years of experience, we're your trusted partner in unlocking the full potential of your yard.\"\n\nMy confirmed facts: Fernhill Garden Design (fictional), owner Dana, Portland, Oregon. Designs small backyards and front yards. In business since 2019. Every project starts with a walk around the client's yard. Every design includes a planting plan for each season. No awards. No guarantee offered.\n\nStep 1: List every factual claim in the draft. For each, say MATCHES MY FACTS, CONFLICTS WITH MY FACTS or NOT IN MY FACTS.\nStep 2: Rewrite the paragraph in plain US English, under 70 words. Keep only claims that match my facts. Remove stock phrases and filler. Do not add new claims. If the paragraph needs a fact I haven't given, write [NEEDED: ...].","answer": "Step 1, claims:\n- \"award-winning\": NOT IN MY FACTS (no awards)\n- \"guaranteed to thrive\": NOT IN MY FACTS (no guarantee offered)\n- \"over 15 years of experience\": CONFLICTS WITH MY FACTS (in business since 2019)\n\nStep 2, rewrite:\nFernhill Garden Design plans small backyards and front yards in Portland, Oregon. We've been designing gardens since 2019. Every project starts with a walk around your yard, and every design comes with a planting plan you can follow season by season.","answer_label": "Illustrative answer, not a live AI result","checks": ["All three unsupported claims were caught: award, guarantee and 15 years.","The rewrite uses only Dana's facts: since 2019, the yard walk-around, the planting plan.","No new claims, numbers or promises were added.","The stock phrases are gone, and it reads like a person talking."],"use": "Check the rewrite once more against your own records, read it aloud, then paste it into your website editor yourself. This page does not save or publish anything.","copy_label": "Copy the example fact-check prompt"},"tasks": [{"id": "factcheck","title": "Fact-check an AI draft","when": "AI has written something for you and you're not sure every claim in it is true.","prepare": ["The draft","Your confirmed facts for this piece"],"questions": [{"key": "draft","label": "Paste the draft to check","help": "Replace customer names and contact details with placeholders first.","example": "In today's fast-paced world, your outdoor space deserves more. At Fernhill Garden Design, we delve into every detail to craft award-winning gardens that are guaranteed to thrive. Moreover, with over 15 years of experience, we're your trusted partner in unlocking the full potential of your yard.","type": "textarea","optional": false,"ph": "DRAFT"},{"key": "facts","label": "Your confirmed facts","help": "Only what you've checked. Include things that are not true, such as \"no awards\".","example": "Fernhill Garden Design (fictional), owner Dana, Portland, Oregon. Designs small backyards and front yards. In business since 2019. Every project starts with a walk around the client's yard. Every design includes a planting plan for each season. No awards. No guarantee offered.","type": "textarea","optional": false,"ph": "CONFIRMED FACTS"},{"key": "business","label": "Describe your business in one sentence.","help": "Saved in your profile if you choose. No customer details or passwords here.","example": "A small garden design studio in Portland, Oregon","type": "text","optional": true,"ph": "ABOUT YOUR BUSINESS"}],"template": ["About my business: {business}","The draft: {draft}","My confirmed facts: {facts}","","List every factual claim in the draft: names, numbers, dates, prices, results, awards, guarantees, reviews and promises. Quote each one. For each, say MATCHES MY FACTS, CONFLICTS WITH MY FACTS or NOT IN MY FACTS, and for conflicts quote the fact it conflicts with. Do not rewrite the draft and do not add facts of your own. If you're unsure whether something is a claim, list it anyway."],"example_values": {"draft": "In today's fast-paced world, your outdoor space deserves more. At Fernhill Garden Design, we delve into every detail to craft award-winning gardens that are guaranteed to thrive. Moreover, with over 15 years of experience, we're your trusted partner in unlocking the full potential of your yard.","facts": "Fernhill Garden Design (fictional), owner Dana, Portland, Oregon. Designs small backyards and front yards. In business since 2019. Every project starts with a walk around the client's yard. Every design includes a planting plan for each season. No awards. No guarantee offered.","business": "A small garden design studio in Portland, Oregon"},"example_answer": "\"award-winning gardens\": NOT IN MY FACTS (your facts say no awards). \"guaranteed to thrive\": NOT IN MY FACTS (your facts say no guarantee offered). \"over 15 years of experience\": CONFLICTS WITH MY FACTS (\"In business since 2019\"). \"Fernhill Garden Design\": MATCHES MY FACTS.","checks": ["Every number, date and claim in the draft appears in the list.","Conflicts quote the right fact from your notes.","Nothing was marked as matching that isn't in your facts.","You've checked any NOT IN MY FACTS items yourself before keeping them."],"repairs": [["Missed a claim","You missed this claim: \"[CLAIM]\". Check it against my facts and label it. Do not rewrite the draft."],["Invented or changed a fact","Replace this assumption with the following confirmed fact: [FACT]. Change nothing else."],["Started rewriting","Stop. Do not rewrite yet. Only list the claims and label each one."]],"next": "Cut or correct every claim that conflicts with or isn't in your facts, then move on to the plain-English edit."},{"id": "edit","title": "Rewrite a draft in plain English","when": "The facts are right, but the draft still sounds stiff, padded or like AI wrote it.","prepare": ["The fact-checked draft","Who will read it","A word limit and spelling style"],"questions": [{"key": "draft","label": "Paste the fact-checked draft","help": "","example": "In today's fast-paced world, your outdoor space deserves more. At Fernhill Garden Design, we delve into every detail to craft award-winning gardens that are guaranteed to thrive. Moreover, with over 15 years of experience, we're your trusted partner in unlocking the full potential of your yard.","type": "textarea","optional": false,"ph": "DRAFT"},{"key": "facts","label": "The facts it must keep","help": "Leave out anything you haven't confirmed. AI will mark it [NEEDED].","example": "Fernhill Garden Design (fictional), owner Dana, Portland, Oregon. Designs small backyards and front yards. In business since 2019. Every project starts with a walk around the client's yard. Every design includes a planting plan for each season. No awards. No guarantee offered.","type": "textarea","optional": false,"ph": "FACTS"},{"key": "reader","label": "Who will read it, in which language, how long?","help": "","example": "Homeowners in Portland, US English, under 70 words","type": "text","optional": false,"ph": "READER AND LENGTH"},{"key": "business","label": "Describe your business in one sentence.","help": "Saved in your profile if you choose. No customer details or passwords here.","example": "A small garden design studio in Portland, Oregon","type": "text","optional": true,"ph": "ABOUT YOUR BUSINESS"}],"template": ["About my business: {business}","The draft: {draft}","Facts it must keep: {facts}","Reader, language and length: {reader}.","","Rewrite the draft in plain English for this reader. Keep only claims that match my facts, exactly as given. Remove stock phrases, filler words and sentences that add no information. Use short sentences and everyday words. Do not add new claims, numbers, examples or promises. If a sentence needs a fact I haven't given, write [NEEDED: ...] instead of guessing."],"example_values": {"draft": "In today's fast-paced world, your outdoor space deserves more. At Fernhill Garden Design, we delve into every detail to craft award-winning gardens that are guaranteed to thrive. Moreover, with over 15 years of experience, we're your trusted partner in unlocking the full potential of your yard.","facts": "Fernhill Garden Design (fictional), owner Dana, Portland, Oregon. Designs small backyards and front yards. In business since 2019. Every project starts with a walk around the client's yard. Every design includes a planting plan for each season. No awards. No guarantee offered.","reader": "Homeowners in Portland, US English, under 70 words","business": "A small garden design studio in Portland, Oregon"},"example_answer": "Fernhill Garden Design plans small backyards and front yards in Portland, Oregon. We've been designing gardens since 2019. Every project starts with a walk around your yard, and every design comes with a planting plan you can follow season by season.","checks": ["Every fact matches your notes; nothing new was added.","Anything unconfirmed is marked [NEEDED] or cut.","No stock openings or filler words are left.","It fits the length and reads well aloud."],"repairs": [["Invented or changed a fact","Replace this assumption with the following confirmed fact: [FACT]. Change nothing else."],["Added a claim","Remove \"[CLAIM]\". It is not in my facts. Change nothing else."],["Still sounds stiff","Make this sentence sound like I'm talking to a customer: \"[SENTENCE]\". Keep every fact."]],"next": "Fill or cut every [NEEDED] gap, then run the meaning check against your original before you publish."},{"id": "compare","title": "Check the edit kept your meaning","when": "You've edited a draft with AI and want to be sure it still says what you meant.","prepare": ["Your original text","The edited version"],"questions": [{"key": "original","label": "Paste your original text","help": "","example": "Most projects start with a yard walk-around. Designs usually include a planting plan.","type": "textarea","optional": false,"ph": "ORIGINAL"},{"key": "edited","label": "Paste the edited version","help": "","example": "Every project starts with a walk around your yard, and every design comes with a planting plan.","type": "textarea","optional": false,"ph": "EDITED VERSION"},{"key": "business","label": "Describe your business in one sentence.","help": "Saved in your profile if you choose. No customer details or passwords here.","example": "A small garden design studio in Portland, Oregon","type": "text","optional": true,"ph": "ABOUT YOUR BUSINESS"}],"template": ["About my business: {business}","My original text: {original}","The edited version: {edited}","","List every place where the meaning changed: facts added or removed, promises made stronger or weaker, conditions or exceptions dropped, and words like \"usually\" or \"most\" that became \"always\" or \"every\". Quote both versions for each one. Do not rewrite anything. If the meaning is the same, say \"No change in meaning\"."],"example_values": {"original": "Most projects start with a yard walk-around. Designs usually include a planting plan.","edited": "Every project starts with a walk around your yard, and every design comes with a planting plan.","business": "A small garden design studio in Portland, Oregon"},"example_answer": "Two changes in meaning: \"Most projects start with a yard walk-around\" became \"Every project starts with a walk around your yard\" (most became every). \"Designs usually include a planting plan\" became \"every design comes with a planting plan\" (usually became always). Both make the promise stronger than the original.","checks": ["Every stronger or weaker promise is listed.","Dropped conditions are caught.","You've decided which version is true for your business.","The final text says only what you can stand behind."],"repairs": [["Missed a change","Compare these two sentences only: \"[ORIGINAL]\" and \"[EDITED]\". Did the meaning change? Do not rewrite them."],["Dropped a condition","Put back this condition exactly: \"[CONDITION]\". Change nothing else."],["Invented or changed a fact","Replace this assumption with the following confirmed fact: [FACT]. Change nothing else."]],"next": "Fix each change so the text matches what is true for your business, read it aloud once more, then publish or send it yourself."}]};const DEMO=false;const BUY="";const EXTRA={};</script><script>

 const total=5, p=`<div class="small">First win · step ${n} of ${total}</div><div class="prog"><i style="width:${n/total*100}%"></i></div>`;
 const nextH=n<total?`#fw/${n+1}`:(DEMO?'#end':(D.craft?'#craft':'#tasks')), nextL=n<total?'Next':(DEMO?'Finish':(D.craft?'Next: why it worked':'Next: choose your real task'));
 let b='';
 if(n==1)b=`<span class="badge">${esc(FW.label)}</span><h2>Step 1: ${esc(FW.step1_title||'The example')}</h2><p>${esc(FW.intro)}</p><div class="inputs">${FW.inputs.map(([k,v])=>`<div><b>${esc(k)}</b>${esc(v)}</div>`).join('')}</div><p class="small">You will do the same with your own task afterwards.</p>`;
 if(n==2)b=`<span class="badge">${esc(FW.label)}</span><h2>Step 2: The completed prompt</h2><p>These facts are turned into a complete prompt. The last line stops the AI from inventing anything.</p><div class="prompt" id="fwp">${esc(FW.prompt)}</div><button class="btn teal" data-copy="#fwp">Copy prompt</button>`;
 if(n==3)b=`<h2>Step 3: Hand it to your AI assistant</h2><p>This guide prepares the prompt. You use it in the AI assistant you already have.</p>${handoff()}<div class="tip">${esc(D.privacy)}</div>`;
 if(n==4)b=`<h2>Step 4: The answer you might get</h2><div class="answer"><span class="lbl">${esc(FW.answer_label)}</span>${esc(FW.answer)}</div><p class="small">Real AI answers vary. Yours may be worded differently; what matters is the check in the next step.</p>`;
 if(n==5)b=`<h2>Step 5: Check before use</h2><p>Tick each check against the real facts, not against what the AI says.</p>${checks(FW.checks,'fwc')}<div class="tip"><b>Use it:</b> ${esc(FW.use)}</div><button class="btn sec sm" data-copy="${esc(FW.answer)}">${esc(FW.copy_label||'Copy the example answer')}</button>`;
 return `<div class="card">${p}${b}<div class="bar">${n>1?back('#fw/'+(n-1)):''}<span class="grow"></span><a class="btn" href="${nextH}">${nextL} &rarr;</a></div></div>`;
}
function start(){
 return `<div class="card"><span class="kicker">${DEMO?'Free demo · no sign-up':'Your working guide'}</span><h1>${esc(DEMO?D.meta.demo_title:D.meta.web_title)}</h1>
 <p>${esc(DEMO?D.meta.demo_intro:(D.meta.web_intro||'Success is not just an AI answer. It is a useful result that you have checked. Work through these steps in order:'))}</p>
 ${DEMO?'':'<ol class="hand">'+D.order.map(s=>`<li>${esc(s)}</li>`).join('')+'</ol>'}
 <div class="bar"><a class="btn" href="#fw/1">Start the first win &rarr;</a>${DEMO?'':'<a class="btn sec" href="#tasks">Skip to my task</a>'}</div></div>`;
}
function craft(){const C=D.craft;return `<div class="card"><span class="kicker">Why it worked</span><h2>The C.R.A.F.T. formula</h2><p>${esc(C.intro)}</p>
 <table><tr><th></th><th>Means</th><th>Ask yourself</th></tr>${C.rows.map(r=>`<tr><td><b>${r[0]}</b></td><td><b>${esc(r[1])}</b><br><span class="small">${esc(r[3])}</span></td><td>${esc(r[2])}</td></tr>`).join('')}</table>
 <div class="tip">${esc(C.in_first_win)}</div><h3>Master template</h3><div class="prompt" id="crt">${hl(C.template)}</div><button class="btn sec sm" data-copy="#crt">Copy template</button>
 <div class="bar"><span class="grow"></span><a class="btn" href="#tasks">Choose your real task &rarr;</a></div></div>`}
function tasks(){return `<div class="card"><span class="kicker">Step 2</span><h2>What do you need to do today?</h2><p>Pick one. You'll answer a few short questions, one at a time, then get a prompt to copy.</p>
 <div class="tasks">${D.tasks.map(t=>`<a class="task" href="#t/${t.id}/intro"><b>${esc(t.title)}</b><span class="small">${esc(t.when)}</span><br>${t.source?`<span class="chip">Based on prompt #${t.source}</span>`:''}</a>`).join('')}</div></div>`}
const T=id=>D.tasks.find(t=>t.id==id);
function prof(){return LS.get(PK,{})}
function langField(q,v){const opts=['English','Chinese (Simplified)','Portuguese','Italian','Dutch','Spanish','French','German','Arabic','Hindi'];
 return `<input type="text" id="qv" list="langs" value="${esc(v)}" placeholder="e.g. English"><datalist id="langs">${opts.map(o=>`<option value="${o}">`).join('')}</datalist>`}
function question(t,i){
 const qs=t.questions,q=qs[i],a=ans[t.id]||(ans[t.id]={});const pr=prof();
 if(a[q.key]===undefined){const m={business:pr.business,tone:pr.tone,lang:pr.lang}[q.key];if(m)a[q.key]=m}
 const v=a[q.key]||'';const input=q.type=='textarea'?`<textarea class="in" id="qv">${esc(v)}</textarea>`:q.type=='lang'?langField(q,v):`<input type="text" id="qv" value="${esc(v)}">`;
 return `<div class="card"><div class="small">${esc(t.title)} · question ${i+1} of ${qs.length}</div><div class="prog"><i style="width:${(i+1)/(qs.length+1)*100}%"></i></div>
 <label class="q" for="qv">${esc(q.label)}${q.optional?' <span class="small">(optional)</span>':''}</label>${q.help?`<p class="small">${esc(q.help)}</p>`:''}${input}
 <div class="ex"><b>Example:</b> ${esc(q.example)} <button class="btn sec sm" id="useex" style="margin-left:6px">Use example</button></div>
 <div class="bar">${back(i?`#t/${t.id}/${i-1}`:`#t/${t.id}/intro`)}<span class="grow"></span><button class="btn" id="qn">${i<qs.length-1?'Next':'Build my prompt'} &rarr;</button></div></div>`;
}
function bindQ(t,i){const q=t.questions[i],a=ans[t.id];const el=$('#qv');el.focus({preventScroll:true});
 const save=()=>{a[q.key]=el.value.trim()};el.addEventListener('input',save);
 $('#useex').onclick=()=>{el.value=q.example;save()};
 $('#qn').onclick=()=>{save();if(!a[q.key]&&!q.optional){if(!confirm('This fact is needed for an accurate result. Continue anyway? The prompt will mark it [FILL IN] so the AI asks you for it.'))return}
  go(i<t.questions.length-1?`#t/${t.id}/${i+1}`:`#t/${t.id}/done`)};
 el.addEventListener('keydown',e=>{if(e.key=='Enter'&&el.tagName=='INPUT'){e.preventDefault();$('#qn').click()}})}
function buildPrompt(t,vals){const out=[];for(const line of t.template){const keys=[...line.matchAll(/\{(\w+)\}/g)].map(m=>m[1]);let skip=false;
 const s=line.replace(/\{(\w+)\}/g,(_,k)=>{const q=t.questions.find(x=>x.key==k);const v=(vals[k]||'').trim();if(v)return v;if(q&&q.optional){skip=true;return''}return `[FILL IN: ${(q&&q.ph)||(D.placeholders||{})[k]||(q?q.label.replace(/\?$/,''):k)}]`});
 if(!skip)out.push(s)}return out.join('\n').replace(/\n{3,}/g,'\n\n').trim()}
function intro(t){return `<div class="card"><span class="kicker">Guided task${t.source?' · prompt #'+t.source:''}</span><h2>${esc(t.title)}</h2><p><b>When to use it:</b> ${esc(t.when)}</p><h3>What to prepare</h3><ul>${t.prepare.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
 <div class="tip">${esc(D.privacy)}</div><div class="bar">${back('#tasks')}<span class="grow"></span><a class="btn" href="#t/${t.id}/0">Start: ${t.questions.length} short questions &rarr;</a></div></div>`}
function done(t){const a=ans[t.id]||{};const p=buildPrompt(t,a);const miss=(p.match(/\[FILL IN/g)||[]).length;
 return `<div class="card"><span class="kicker">${esc(t.title)} · your prompt</span><h2>Check and copy your prompt</h2><p class="small">You can edit the text below before copying. Edits are not saved.</p>
 ${miss?`<div class="note">${miss} fact(s) are marked [FILL IN]. Fill them in here, or the AI should ask you for them. Never let it guess.</div>`:''}
 <textarea class="prompt" id="tp">${esc(p)}</textarea><div class="bar"><button class="btn teal" data-copy="#tp">Copy prompt</button>${back(`#t/${t.id}/${t.questions.length-1}`)}</div></div>
 <div class="card"><h3>Use it in your AI assistant</h3>${handoff()}<div class="tip">${esc(D.privacy)}</div></div>
 <div class="card"><h3>What a good answer looks like</h3><div class="answer"><span class="lbl">Illustrative answer, not a live AI result</span>${esc(t.example_answer)}</div><p class="small">Based on the example answers to each question, not your own. Your AI's answer will differ.</p></div>
 <div class="card"><h3>Check before use</h3><p>Compare against your own records: ${esc(D.verify)}</p>${checks(t.checks,'tc-'+t.id)}</div>
 <div class="card"><h3>If something is wrong, send a repair</h3><p class="small">Copy one, fill in the brackets, and send it in the same AI chat.</p>
 ${t.repairs.concat(D.repairs_general.slice(0,4)).map(([w,r],i)=>`<div class="rep"><b>${esc(w)}</b><code id="rp${i}">${hl(r)}</code><button class="btn sec sm" data-copy="#rp${i}">Copy</button></div>`).join('')}</div>
 <div class="card"><h3>Next action</h3><p><b>${esc(t.next)}</b> This page never sends anything for you.</p>
 <div class="bar"><a class="btn sec" href="#profile">Save my business details (optional)</a><a class="btn sec" href="#tasks">Do another task</a>${LIBN?`<a class="btn" href="#library">Explore the ${LIBN}-prompt library &rarr;</a>`:''}</div></div>`}
function library(){const my=LS.get(MK,[]);
 return `<div class="card"><span class="kicker">Reference</span><h2>The ${LIBN}-prompt library</h2><p class="small">Replace each <span class="fill">[BRACKET]</span> with your confirmed facts. Tap ☆ to keep a prompt in My prompts (saved on this device only).</p>
 <input type="search" id="q" placeholder="Search prompts, e.g. invoice, review, caption"><p class="small" id="cnt"></p></div>
 <div id="libl">${D.library.map((c,ci)=>`<div class="card lib" data-cat><h3>${ci+1}. ${esc(c.name)}</h3><p class="small">${esc(c.intro)}</p>${c.prompts.map(p=>`<div class="p" data-t="${esc((p.name+' '+p.text+' '+c.name).toLowerCase())}"><span class="n">${p.n}</span><b>${esc(p.name)}</b>${LC[p.n]?' <span class="chip">Improved</span>':''}<div id="lp${p.n}" style="margin:6px 0">${hl(p.text)}</div><button class="btn sec sm" data-copy="#lp${p.n}">Copy</button> <button class="btn sec sm" data-star="${p.n}">${my.some(m=>m.n==p.n)?'★ Saved':'☆ Save'}</button></div>`).join('')}</div>`).join('')}</div>`}
function bindLib(){const q=$('#q');const f=()=>{const v=q.value.trim().toLowerCase();let n=0;document.querySelectorAll('.lib .p').forEach(p=>{const s=!v||p.dataset.t.includes(v);p.style.display=s?'':'none';n+=s});document.querySelectorAll('[data-cat]').forEach(c=>c.style.display=[...c.querySelectorAll('.p')].some(p=>p.style.display!='none')?'':'none');$('#cnt').textContent=`${n} of ${LIBN} prompts`};q.addEventListener('input',f);f()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-star]');if(!b)return;const n=+b.dataset.star;let my=LS.get(MK,[]);
 if(my.some(m=>m.n==n)){my=my.filter(m=>m.n!=n);b.textContent='☆ Save'}else{const p=D.library.flatMap(c=>c.prompts).find(p=>p.n==n);my.push({n,name:p.name,text:p.text,note:''});b.textContent='★ Saved'}LS.set(MK,my)});
function mine(){const my=LS.get(MK,[]);return `<div class="card"><span class="kicker">My prompts</span><h2>Your personal prompt collection</h2><p class="small">Saved only in this browser on this device. Keep the [BRACKETS] here and fill in real facts each time; don't store customer details.</p>
 ${my.length?my.map((m,i)=>`<div class="rep"><b>#${m.n} ${esc(m.name)}</b><code id="mp${i}">${hl(m.text)}</code><input type="text" data-note="${i}" value="${esc(m.note)}" placeholder="When I use it (e.g. Monday mornings)"><div class="bar"><button class="btn sec sm" data-copy="#mp${i}">Copy</button><button class="btn warn sm" data-rm="${i}">Remove</button></div></div>`).join(''):'<p>No saved prompts yet. Tap ☆ Save in the <a href="#library">library</a>.</p>'}
 ${my.length?'<button class="btn warn" id="clrm">Forget all my saved prompts</button>':''}</div>`}
function bindMine(){document.querySelectorAll('[data-note]').forEach(i=>i.addEventListener('input',()=>{const my=LS.get(MK,[]);my[+i.dataset.note].note=i.value.slice(0,120);LS.set(MK,my)}));
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const my=LS.get(MK,[]);my.splice(+b.dataset.rm,1);LS.set(MK,my);render()});
 const c=$('#clrm');if(c)c.onclick=()=>{LS.del(MK);toast('Saved prompts removed');render()}}
function profile(){const p=prof();return `<div class="card"><span class="kicker">Optional</span><h2>Your business profile</h2><p>${esc(D.profile_note)}</p>
 <label class="q" for="pb">Business description</label><input type="text" id="pb" value="${esc(p.business)}" placeholder="A family-run shoe store in Denver">
 <label class="q" for="pt">Preferred tone</label><input type="text" id="pt" value="${esc(p.tone)}" placeholder="Friendly and clear">
 <label class="q" for="pl">Preferred reply language</label>${langField({}, p.lang||'').replace('id="qv"','id="pl"')}
 <div class="bar"><button class="btn" id="psave">Save on this device</button><button class="btn warn" id="pforget">Forget my details and saved prompts</button></div><p class="small" id="pst">${Object.keys(p).length?'Details are saved on this device.':'Nothing saved.'}</p>
 <div class="tip">${esc(D.privacy)}</div></div>`}
function bindProfile(){$('#psave').onclick=()=>{const p={business:$('#pb').value.trim().slice(0,200),tone:$('#pt').value.trim().slice(0,60),lang:$('#pl').value.trim().slice(0,40)};Object.keys(p).forEach(k=>!p[k]&&delete p[k]);LS.set(PK,p);$('#pst').textContent='Saved on this device.';toast('Saved')};
 $('#pforget').onclick=()=>{LS.del(PK);LS.del(MK);['#pb','#pt','#pl'].forEach(s=>$(s).value='');$('#pst').textContent='Forgotten: your profile and saved prompts are removed from this device.';toast('Details and saved prompts forgotten')}}
function practice(){const P=D.practice;return `<div class="card"><span class="kicker">Practice</span><h2>Your 7-day challenge</h2><p>${esc(P.intro)}</p><table><tr><th>Day</th><th>Do this</th><th>Use</th></tr>${P.days.map(d=>`<tr><td>${d[0]}</td><td>${esc(d[1])}</td><td>${esc(d[2])}</td></tr>`).join('')}</table>
 <h3 style="margin-top:14px">Repairs that work for any task</h3>${D.repairs_general.map(([w,r],i)=>`<div class="rep"><b>${esc(w)}</b><code id="gr${i}">${hl(r)}</code><button class="btn sec sm" data-copy="#gr${i}">Copy</button></div>`).join('')}<div class="note">${esc(D.verify)}</div></div>`}
function end(){const X=(typeof EXTRA!=='undefined'&&EXTRA)||{};const fw=D.first_win||{};return `<div class="card"><span class="kicker">You did it</span><h2>That's a complete, checked AI task.</h2>
 <p><b>What you just did:</b> you gave the AI only confirmed facts, got a draft, and checked it before use${fw.checks?` (${fw.checks.length} checks)`:''}. That is the whole method.</p>
 <p><b>What the full guide adds:</b> ${esc(D.meta.demo_pitch)}</p>
 <div class="bar"><a class="btn" href="${BUY}">Get the full guide · USD 2.70</a>${X.guide?`<a class="btn sec" href="${X.guide}">See what's inside</a>`:''}</div>
 <p class="small">Secure checkout by Stripe. Instant access after payment.${X.support?` Not useful? Email ${esc(X.support)} within 7 days for a refund.`:''}</p>
 ${X.bundle?`<div class="tip"><b>Want every guide?</b> The All-Access Library is USD ${X.bundle_price} for every current guide plus every future release. <a href="${X.bundle}">Get All-Access →</a></div>`:''}
 <p class="small"><a href="/catalog.html">Browse the library</a></p></div>`}
const TABS=DEMO?[]:[['#start','Start'],['#fw/1','First win'],D.craft&&['#craft','C.R.A.F.T.'],['#tasks','Tasks'],LIBN&&['#library','Library'],D.practice&&['#practice','Practice'],LIBN&&['#mine','My prompts'],['#profile','Profile']].filter(Boolean);
function render(){const h=location.hash||'#start';const [r,a,b]=h.slice(1).split('/');let html='',bind=null;
 if(r=='fw')html=fw(Math.min(5,Math.max(1,+a||1)));
 else if(DEMO&&r=='end')html=end();
 else if(!DEMO&&r=='craft'&&D.craft)html=craft();
 else if(!DEMO&&r=='tasks')html=tasks();
 else if(!DEMO&&r=='t'&&T(a)){const t=T(a);if(b=='intro')html=intro(t);else if(b=='done')html=done(t);else{const i=Math.min(t.questions.length-1,Math.max(0,+b||0));html=question(t,i);bind=()=>bindQ(t,i)}}
 else if(!DEMO&&r=='library'&&LIBN){html=library();bind=bindLib}
 else if(!DEMO&&r=='mine'&&LIBN){html=mine();bind=bindMine}
 else if(!DEMO&&r=='profile'){html=profile();bind=bindProfile}
 else if(!DEMO&&r=='practice'&&D.practice)html=practice();
 else html=start();
 app.innerHTML=html;if(bind)bind();
 const tabs=$('#tabs');if(tabs)tabs.innerHTML=TABS.map(([k,l])=>`<a href="${k}" class="${('#'+r).startsWith(k.split('/')[0])&&(k!='#start'||r=='start'||!r)?'on':''}">${l}</a>`).join('');
 window.scrollTo(0,0)}
addEventListener('hashchange',render);render();
</script></body></html>
