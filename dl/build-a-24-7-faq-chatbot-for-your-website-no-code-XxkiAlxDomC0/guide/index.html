nvent weekday hours, fees, insurance details or medical advice. If an essential fact is missing, ask me before drafting. End with one clear next step.", "answer": "Yes — we're open Saturday 9am–1pm. Free parking is in the lot behind the clinic on Cedar Street. Want an appointment? Book online or call our front desk and we'll help you find a time.", "answer_label": "Illustrative answer, not a live AI result", "checks": ["Saturday hours and parking match the confirmed facts exactly.", "No weekday hours, fees, insurance or medical claims were added.", "It ends with one clear next step (book or call).", "A human reads it before it enters the chatbot knowledge base."], "use": "Copy the checked answer into your chatbot FAQ entry yourself. The webpage does not publish anything to your site.", "copy_label": "Copy the example answer"}, "tasks": [{"id": "faqbase", "title": "Build FAQ pairs from your facts", "when": "You want a clean list of question-and-answer pairs before you touch any chatbot tool.", "prepare": ["A one-sentence description of your business", "Confirmed hours, booking method and key policy from your own records", "Any published price ranges you are willing to show (or write \"ask us\")"], "questions": [{"key": "business", "label": "Describe your business in one sentence.", "help": "Saved in your profile if you choose. No customer details here.", "example": "Riverbend Dental, a family dental clinic in Austin, Texas (fictional)", "type": "text", "optional": false, "ph": "ABOUT YOUR BUSINESS"}, {"key": "hours", "label": "What are your confirmed open hours (including any Saturday or evening hours)?", "help": "Copy from your website or door sign.", "example": "Mon–Thu 8am–5pm, Fri 8am–2pm, Sat 9am–1pm; closed Sunday", "type": "textarea", "optional": false, "ph": "CONFIRMED HOURS"}, {"key": "booking", "label": "How should visitors book or reach you?", "help": "Only methods you actually offer.", "example": "Book online via our website form, or call the front desk", "type": "text", "optional": false, "ph": "HOW TO BOOK"}, {"key": "policy", "label": "What is one key policy visitors ask about?", "help": "Cancellation, deposit, returns — only what you have written down.", "example": "Please give 24 hours' notice to reschedule a cleaning appointment", "type": "text", "optional": false, "ph": "KEY POLICY"}, {"key": "lang", "label": "Which language should the FAQ answers use?", "help": "Choose your visitors' language.", "example": "English", "type": "lang", "optional": false, "ph": "LANGUAGE"}], "template": ["Turn these confirmed business facts into 8 short FAQ question-and-answer pairs for a website chatbot.", "About us: {business}", "Hours: {hours}", "How to book: {booking}", "Key policy: {policy}", "Language: {lang}. Tone: friendly and clear. Each answer under 60 words.", "", "Use only these facts. Do not invent prices, insurance, medical advice or services I did not list. If a fact is missing, ask me instead of guessing. End answers that need a decision with one clear next step."], "example_values": {"business": "Riverbend Dental, a family dental clinic in Austin, Texas (fictional)", "hours": "Mon–Thu 8am–5pm, Fri 8am–2pm, Sat 9am–1pm; closed Sunday", "booking": "Book online via our website form, or call the front desk", "policy": "Please give 24 hours' notice to reschedule a cleaning appointment", "lang": "English"}, "example_answer": "Q: What are your hours?\nA: We're open Mon–Thu 8am–5pm, Fri 8am–2pm and Sat 9am–1pm. Closed Sunday. Book online or call the front desk.\n\nQ: How do I book?\nA: Use the booking form on our website, or call the front desk and we'll find a time.\n\nQ: How do I reschedule a cleaning?\nA: Please give 24 hours' notice. Book a new time online or call the front desk.\n\n(Additional pairs would stay inside the same facts.)", "checks": ["Every hour and policy matches your records exactly.", "No prices, insurance or medical claims were invented.", "Answers are short and end with a clear next step where needed.", "Anything missing was flagged instead of guessed."], "repairs": [["Wrong hour or policy", "Replace this assumption with the following confirmed fact: [FACT]. Change nothing else."], ["Invented price or service", "Remove the [PRICE / SERVICE]. I did not provide it. Keep everything else."], ["Too long", "Cut each answer to under 60 words. Keep every confirmed fact."]], "next": "Paste the checked Q&A pairs into a simple document. That document becomes the knowledge base you load into your chatbot tool."}, {"id": "faqanswer", "title": "Draft one chatbot FAQ answer", "when": "A visitor question comes up often and you want a single checked answer for the bot.", "prepare": ["The question in the visitor's own words", "Only the confirmed facts that answer it"], "questions": [{"key": "business", "label": "Describe your business in one sentence.", "help": "Saved in your profile if you choose. No customer details here.", "example": "Harbor Lane Café, a neighborhood café in Portland, Oregon (fictional)", "type": "text", "optional": false, "ph": "ABOUT YOUR BUSINESS"}, {"key": "question", "label": "What question should the chatbot answer?", "help": "Use the words customers actually type.", "example": "Do you have gluten-free options?", "type": "text", "optional": false, "ph": "VISITOR QUESTION"}, {"key": "facts", "label": "What are the confirmed facts that answer it?", "help": "Copy from your menu or policy. Don't guess.", "example": "We have two gluten-free sandwiches and a gluten-free brownie daily; kitchen also handles wheat, so not a dedicated gluten-free facility", "type": "textarea", "optional": false, "ph": "CONFIRMED FACTS"}, {"key": "tone", "label": "What tone?", "help": "", "example": "Friendly and clear", "type": "text", "optional": false, "ph": "TONE"}, {"key": "lang", "label": "Which language should the answer use?", "help": "Choose your visitors' language.", "example": "English", "type": "lang", "optional": false, "ph": "LANGUAGE"}], "template": ["Write a short FAQ chatbot answer in {lang}, under 60 words, tone: {tone}.", "About us: {business}", "Visitor question: {question}", "Confirmed facts: {facts}", "", "Use only these facts. Do not invent ingredients, allergens beyond what I listed, prices or guarantees. If an essential fact is missing, ask me before drafting. End with one clear next step."], "example_values": {"business": "Harbor Lane Café, a neighborhood café in Portland, Oregon (fictional)", "question": "Do you have gluten-free options?", "facts": "We have two gluten-free sandwiches and a gluten-free brownie daily; kitchen also handles wheat, so not a dedicated gluten-free facility", "tone": "Friendly and clear", "lang": "English"}, "example_answer": "Yes — we usually have two gluten-free sandwiches and a gluten-free brownie each day. Our kitchen also handles wheat, so we are not a dedicated gluten-free facility. Ask our team in person about today's options.", "checks": ["Every food fact matches what you actually offer today.", "No prices or absolute \"safe for celiac\" claims were added.", "It is under 60 words and ends with a next step.", "A human approved it before loading it into the bot."], "repairs": [["Wrong or invented fact", "Replace this assumption with the following confirmed fact: [FACT]. Change nothing else."], ["Over-promised safety", "Remove any claim that we are a dedicated allergen-free kitchen. Keep the listed options only."], ["Too vague", "Rewrite to include this confirmed detail: [FACT]. Keep the length under 60 words."]], "next": "Paste the checked answer into your chatbot knowledge base and ask the preview bot the same question on your phone."}, {"id": "handoff", "title": "Write a human hand-off line", "when": "You need the bot to stop guessing and pass the visitor to a person.", "prepare": ["When the bot should hand off (unsure, complaint, after hours)", "How your team actually follows up"], "questions": [{"key": "business", "label": "Describe your business in one sentence.", "help": "Saved in your profile if you choose. No customer details here.", "example": "Northbridge Tutoring, a small tutoring studio in Manchester, UK (fictional)", "type": "text", "optional": false, "ph": "ABOUT YOUR BUSINESS"}, {"key": "trigger", "label": "When should the bot hand off to a human?", "help": "Be specific.", "example": "If unsure after one try, or if the visitor mentions billing, complaints or exam advice", "type": "textarea", "optional": false, "ph": "HAND-OFF TRIGGERS"}, {"key": "followup", "label": "How does a human follow up?", "help": "Only what you can keep.", "example": "We reply by email on the next business morning", "type": "text", "optional": false, "ph": "HUMAN FOLLOW-UP"}, {"key": "tone", "label": "What tone?", "help": "", "example": "Calm and helpful", "type": "text", "optional": false, "ph": "TONE"}, {"key": "lang", "label": "Which language should the hand-off use?", "help": "Choose your visitors' language.", "example": "English", "type": "lang", "optional": false, "ph": "LANGUAGE"}], "template": ["Write 3 short chatbot hand-off lines in {lang}, tone {tone}, each under 40 words.", "About us: {business}", "Hand off when: {trigger}", "Human follow-up: {followup}", "Remind visitors not to paste passwords, card numbers or ID documents.", "", "Situations: (1) bot is unsure, (2) off-limits topic, (3) after hours leave-a-message.", "Use only these facts. Do not promise a reply speed I did not confirm. If something essential is missing, ask me before drafting."], "example_values": {"business": "Northbridge Tutoring, a small tutoring studio in Manchester, UK (fictional)", "trigger": "If unsure after one try, or if the visitor mentions billing, complaints or exam advice", "followup": "We reply by email on the next business morning", "tone": "Calm and helpful", "lang": "English"}, "example_answer": "1) I'm not sure I have the right answer. Leave your question and the best email to reach you (no passwords or card details) and a person from our team will help. s not send your prompts anywhere; it only prepares the text for you to copy.", "verify": "Check every name, number, date, price and policy against your own records (the invoice, quote, policy text or booking system). Asking the AI “are you sure?” or “how confident are you?” is not verification: it can sound sure and still be wrong.", "repairs_general": [["Wrong or invented fact", "Replace this assumption with the following confirmed fact: [FACT]. Change nothing else."], ["Promise you can't keep", "Remove any promise about [REFUNDS / STOCK / DELIVERY / DISCOUNTS]. We have not confirmed that."], ["Missing information", "You assumed [X]. Do not guess. Leave a gap marked [TO CONFIRM] instead."], ["Too long", "Cut this to [NUMBER] words. Keep the key message and every confirmed fact."], ["Wrong tone", "Rewrite in a [WARMER / MORE FORMAL / FIRMER] tone. Keep the facts exactly as they are."], ["Wrong language", "Rewrite this in [LANGUAGE]. Keep names, numbers and dates exactly as written."], ["Too generic", "Use my details: [PASTE FACTS]. Remove anything that could apply to any business."]], "profile_note": "Optional: save your business description, preferred tone and preferred reply language on this device so they are filled in next time. They are stored only in this browser on this device, not on our servers. Your task answers are never saved. You can remove everything at any time with Forget my details and saved prompts.", "order": ["Complete the first win using a fictional example.", "Choose a real task from the guided options.", "Answer a few short questions with your confirmed facts, one at a time.", "Copy the completed prompt and use it in your AI assistant.", "Check the result with the task's checklist and repair it if needed.", "Use the checked result yourself, and optionally save your business details on this device.", "Explore the prompt library and the PDF for more."], "library": [{"name": "Why FAQ chatbots embarrass you (and how to avoid it)", "intro": "", "prompts": [{"n": 1, "name": "Prompt · Spot weak FAQ answers", "text": "Here are FAQ draft answers for my website chatbot:\n[PASTE 3–5 DRAFT Q&A PAIRS]\n\nFor each answer, tell me: (1) which facts look confirmed, (2) which parts look like guesses or vague promises, (3) one safer rewrite that uses only confirmed facts and offers a human hand-off if anything is missing. Do not invent hours, prices or policies. If a fact is missing, ask me."}]}, {"name": "Build your FAQ knowledge base", "intro": "", "prompts": [{"n": 2, "name": "Prompt · Turn business facts into FAQ pairs", "text": "Turn these confirmed business facts into 10 short FAQ question-and-answer pairs for a website chatbot.\n\nBusiness: [ONE-SENTENCE DESCRIPTION]\nConfirmed facts:\n[HOURS]\n[LOCATION / PARKING]\n[HOW TO BOOK]\n[PUBLISHED PRICE RANGES OR \"ASK US\"]\n[KEY POLICY]\nTone: [FRIENDLY / PROFESSIONAL], language: [LANGUAGE].\n\nEach answer under 60 words. Use only these facts. Put anything that changes per customer in [BRACKETS]. If a fact is missing, ask me instead of inventing it. End answers that need a booking or decision with one clear next step."}]}, {"name": "Pick a no-code chat option", "intro": "", "prompts": [{"n": 3, "name": "Prompt · Choose a fit (no invented prices)", "text": "I need a no-code FAQ chatbot for my website.\nBusiness: [ONE SENTENCE]\nWebsite platform: [BUILDER OR HOST]\nMust-haves: [E.G. EDITABLE FAQ, HUMAN HAND-OFF, WORKS ON MOBILE]\nNice-to-haves: [E.G. AFTER-HOURS ONLY]\nBudget comfort: [E.G. FREE TIER FIRST / PAID OK — do not invent dollar amounts]\n\nSuggest 3 option types (not brand rankings) that fit these needs, with one pro and one caution each. Do not invent prices or claim a tool has a feature I did not confirm. Ask me if you need more information."}]}, {"name": "Draft chatbot answers with AI", "intro": "", "prompts": [{"n": 4, "name": "Prompt · One FAQ answer", "text": "Write a short FAQ chatbot answer in [LANGUAGE], under 60 words, tone [FRIENDLY / PROFESSIONAL].\n\nVisitor question: [QUESTION]\nConfirmed facts: [FACTS FROM MY RECORDS]\nBusiness: [ONE SENTENCE]\n\nUse only these facts. Do not invent hours, prices, availability, medical advice or guarantees. If something essential is missing, ask me before drafting. End with one clear next step (book, call, email or \"talk to a person\")."}, {"n": 5, "name": "Prompt · Batch of 5 answers", "text": "Using only the confirmed facts below, write 5 FAQ chatbot answers for these questions. Each under 60 words, tone [TONE], language [LANGUAGE].\n\nQuestions:\n1. [Q1]\n2. [Q2]\n3. [Q3]\n4. [Q4]\n5. [Q5]\n\nConfirmed facts:\n[PASTE YOUR FACTS SHEET]\n\nLabel any question you cannot answer from the facts as NEEDS HUMAN. Do not invent details. Ask me if a required fact is missing."}]}, {"name": "Tone, limits and human hand-off", "intro": "", "prompts": [{"n": 6, "name": "Prompt · Bot personality + limits", "text": "Write a short system / welcome setup for my website FAQ chatbot (under 120 words).\n\nBusiness: [ONE SENTENCE]\nBot name: [NAME]\nTone: [TONE]\nIt MAY answer: [ALLOWED TOPICS]\nIt must NOT answer: [OFF-LIMITS]\nWhen unsure or off-limits it should say: [HAND-OFF LINE]\nHuman contact: [EMAIL OR \"contact form\" — no private numbers unless you publish them]\n\nUse only these facts. Do not invent services, prices or medical claims. If something essential is missing, ask me."}]}, {"name": "Test before you go live", "intro": "", "prompts": [{"n": 7, "name": "Prompt · Build a test script", "text": "Create a 12-question chatbot test script for my business.\n\nBusiness: [ONE SENTENCE]\nFAQ topics I cover: [LIST]\nOff-limits topics: [LIST]\n\nInclude: 6 fair FAQ questions (with slight rephrasing), 2 with typos, 2 off-limits, 2 completely unrelated. For each, write what a GOOD bot should do (answer from FAQ / hand off / ask a clarifying question). Do not invent FAQ answers; leave answer content to my knowledge base."}]}, {"name": "Hand-off scripts and escalation", "intro": "", "prompts": [{"n": 8, "name": "Prompt · Hand-off message", "text": "Write 3 short chatbot hand-off lines in [LANGUAGE], tone [TONE], each under 40 words.\n\nSituations:\n1) Bot is unsure\n2) Visitor asks something off-limits (complaint / medical / account)\n3) After hours — leave a message\n\nBusiness: [ONE SENTENCE]\nHow humans follow up: [E.G. email next business morning]\nWhat visitors must NOT paste: passwords, card numbers, ID documents\n\nUse only these facts. Do not promise a reply time you have not confirmed. If a fact is missing, ask me."}, {"n": 9, "name": "Prompt · Morning follow-up from a human", "text": "Draft a short human follow-up email/message (under 80 words) for a visitor who left a chatbot hand-off overnight.\n\nBusiness: [ONE SENTENCE]\nWhat they asked (anonymized): [TOPIC]\nWhat we can confirm: [FACTS]\nNext step: [CALL / BOOKING LINK / ASK ONE QUESTION]\nTone: [TONE], language: [LANGUAGE]\n\nUse only these facts. Do not invent outcomes. If something essential is missing, ask me before drafting."}]}, {"name": "Your 7-day chatbot launch plan", "intro": "", "prompts": [{"n": 10, "name": "Prompt · Weekly chatbot review", "text": "Here are anonymized themes from this week's chatbot logs (no names or contact details):\n[LIST TOPICS + whether answered or handed off]\n\nSuggest which 3 FAQ entries to improve or add, using only these themes. Do not invent policies. Ask me for any fact you need before drafting new answers."}]}]};const DEMO=false;const BUY="";const EXTRA={};</script><script>

function bindQ(t,i){const q=t.questions[i],a=ans[t.id];const el=$('#qv');el.focus({preventScroll:true});

function buildPrompt(t,vals){const out=[];for(const line of t.template){const keys=[...line.matchAll(/\{(\w+)\}/g)].map(m=>m[1]);let skip=false;
