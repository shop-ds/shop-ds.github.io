in [LANGUAGE]. Keep names, numbers and dates exactly as written."],["Too generic","Use my details: [PASTE FACTS]. Remove anything that could apply to any business."]],"profile_note": "Optional: save your business description, preferred tone and preferred reply language on this device so they are filled in next time. They are stored only in this browser on this device, not on our servers. Your task answers are never saved. You can remove everything at any time with Forget my details and saved prompts.","order": ["Complete the first win using a fictional example.","Choose a real task from the guided options.","Answer a few short questions with your confirmed facts, one at a time.","Copy the completed prompt and use it in your AI assistant.","Check the result with the task's checklist and repair it if needed.","Use the checked result yourself, and optionally save your business details on this device.","Explore the prompt library and the PDF for more."],"meta": {"web_title": "Your brand voice in a one-page brief: make AI drafts sound like you","demo_title": "Try it: turn a generic AI email into one that sounds like a fictional bookkeeper","demo_intro": "Walk through one complete fictional example: a small bookkeeping firm using a short voice header so an AI reminder email sounds like the owner. See how the facts stay fixed, how a missing date is marked instead of invented, then check the draft. Takes about 5 minutes.","demo_pitch": "The full guide covers spotting generic AI writing, collecting your best samples, describing your voice in a few words, word lists and house rules, the one-page brief, three worked examples, the \"paste this first\" header, plus guided tasks, repair prompts, a voice checklist and the PDF.","description": "Capture how you write so every AI draft starts on-brand: a one-page voice brief, worked examples and a paste-this-first prompt header. A free Coaching Codex walkthrough.","slug": "your-brand-voice-in-a-one-page-brief-make-ai-sound-like-you","title": "Your Brand Voice in a One-Page Brief: Make AI Sound Like You","storage": "cc.your-brand-voice-in-a-one-page-brief-mak"},"first_win": {"label": "Fictional example","step1_title": "The voice and the facts","intro": "Priya runs a made-up bookkeeping firm. Her AI drafts come back stiff (\"We are thrilled to remind you...\"), so she writes a short voice header and gives AI only the facts for one reminder email. She hasn't confirmed the deadline yet. Nothing here is a real business, real people, real advice or live AI output.","inputs": [["Business","Northgate Bookkeeping (fictional), owner Priya, small-business bookkeeping in Leeds, UK"],["Voice","Friendly but not chummy; clear but not cold; calm but not vague"],["Words to avoid","leverage, thrilled, dear valued client"],["House rules","UK spelling; open \"Hi [NAME],\"; sign off \"Speak soon, Priya\"; no emojis in email"],["Facts","Reminder to client Sam to send this quarter's receipts; reply to the email with questions"],["Not known yet","The exact deadline date"]],"prompt": "Write in the voice of Northgate Bookkeeping, a small-business bookkeeping firm (fictional practice example).\nVoice: friendly but not chummy; clear but not cold; calm but not vague.\nUse words like: sorted, here's what happens next. Avoid: leverage, thrilled, dear valued client.\nHouse rules: UK spelling; open \"Hi Sam,\"; sign off \"Speak soon, Priya\"; no emojis.\nFacts rule: use only the facts below. Do not invent dates, fees, penalties or offers. If something essential is missing, write [NEEDED: ...].\n\nTask: a short reminder email in English, under 80 words.\nFacts: Sam needs to send this quarter's receipts. We then check the figures and say if anything is missing. Sam can reply with questions. Deadline date not confirmed.","answer": "Hi Sam,\n\nA quick reminder to send over your receipts for this quarter by [NEEDED: deadline date].\n\nHere's what happens next: once we have them, we'll check the figures and let you know if anything's missing.\n\nAny questions, just reply to this email.\n\nSpeak soon,\nPriya","answer_label": "Illustrative answer, not a live AI result","checks": ["The facts match Priya's notes: receipts, the check, replying with questions.","The deadline is marked [NEEDED], not invented.","No fees, penalties or offers were added.","It sounds friendly and clear, uses none of the avoided words, and ends with her sign-off."],"use": "Replace [NEEDED: deadline date] with the date you've confirmed, read the email aloud against your voice brief, then send it from your own email account yourself. This page does not save or send anything.","copy_label": "Copy the example voice prompt"},"tasks": [{"id": "brief","title": "Build your one-page voice brief","when": "Your AI drafts sound generic and you keep making the same style fixes.","prepare": ["Three to five short samples you wrote","A few words for how you sound","Words you use and avoid"],"questions": [{"key": "samples","label": "Paste 3 to 5 short samples you wrote","help": "Remove names and private details first.","example": "Email: Hi Sam, all sorted. Here's what happens next: we'll check the figures. No rush. Speak soon, Priya. Post: Receipts in a shoebox? That's fine. Send them over.","type": "textarea","optional": false,"ph": "SAMPLES"},{"key": "reader","label": "Who do you usually write to?","help": "","example": "Small business owners who'd rather not think about bookkeeping","type": "text","optional": false,"ph": "READER"},{"key": "voice","label": "Voice words, each with its \"not\"","help": "","example": "Friendly but not chummy; clear but not cold; calm but not vague","type": "textarea","optional": false,"ph": "VOICE WORDS"},{"key": "words","label": "Words you use, and words you avoid","help": "","example": "Use: sorted, no rush, here's what happens next. Avoid: leverage, thrilled, dear valued client","type": "textarea","optional": false,"ph": "WORD LISTS"},{"key": "rules","label": "House rules","help": "","example": "UK spelling; dates as 14 March; open \"Hi [NAME],\"; sign off \"Speak soon, Priya\"","type": "text","optional": false,"ph": "HOUSE RULES"},{"key": "business","label": "Describe your business in one sentence.","help": "Saved in your profile if you choose. No customer details or passwords here.","example": "A two-person bookkeeping firm for small businesses in Leeds, UK","type": "text","optional": true,"ph": "ABOUT YOUR BUSINESS"}],"template": ["About my business: {business}","My writing samples: {samples}","Who I write for: {reader}.","My voice words: {voice}.","My word lists: {words}.","My house rules: {rules}.","","Combine these into a one-page brand voice brief with these headings in order: who we write for, our voice, words we use, words we avoid, house rules, facts rule (keep my facts exactly; mark anything missing as [NEEDED]), sample. Use only what I've given. Quote one short line from my samples as the sample. Do not add voice words, rules or claims about my business. If a heading has nothing from me, write [NEEDED: ...]. Keep it under 300 words."],"example_values": {"samples": "Email: Hi Sam, all sorted. Here's what happens next: we'll check the figures. No rush. Speak soon, Priya. Post: Receipts in a shoebox? That's fine. Send them over.","reader": "Small business owners who'd rather not think about bookkeeping","voice": "Friendly but not chummy; clear but not cold; calm but not vague","words": "Use: sorted, no rush, here's what happens next. Avoid: leverage, thrilled, dear valued client","rules": "UK spelling; dates as 14 March; open \"Hi [NAME],\"; sign off \"Speak soon, Priya\"","business": "A two-person bookkeeping firm for small businesses in Leeds, UK"},"example_answer": "Who we write for: small business owners who'd rather not think about bookkeeping. Our voice: friendly not chummy; clear not cold; calm not vague. Use: sorted, no rush. Avoid: leverage, thrilled. House rules: UK spelling; sign off \"Speak soon, Priya\". Facts rule: keep my facts; mark gaps [NEEDED]. Sample: \"Receipts in a shoebox? That's fine.\"","checks": ["Every heading uses only what you supplied, or says [NEEDED].","The voice words match how your samples really sound.","The sample line is quoted from your own writing.","It fits on one page."],"repairs": [["Invented or changed a fact","Replace this assumption with the following confirmed fact: [FACT]. Change nothing else."],["Added a rule I didn't give","Remove \"[RULE]\". It is not in my notes. Change nothing else."],["Too long","Shorten the brief to under 250 words. Keep every heading and every rule I gave."]],"next": "Save the brief in a document you can open quickly, share it with anyone who writes for you, then turn it into the paste-this-first header."},{"id": "draft","title": "Write a draft in your voice","when": "You need an email, post or short web text and want AI's first draft to sound like you.","prepare": ["Your voice brief or header","What to write, for whom and how long","The confirmed facts for this piece"],"questions": [{"key": "header","label": "Paste your voice brief or header","help": "","example": "Who we write for: small business owners who'd rather not think about bookkeeping. Our voice: friendly but not chummy; clear but not cold; calm but not vague. Words we use: sorted, no rush, here's what happens next. Words we avoid: leverage, thrilled, dear valued client. House rules: UK spelling; dates as 14 March; one exclamation mark at most; open \"Hi [NAME],\" and sign off \"Speak soon, Priya\". Facts rule: keep my facts exactly; mark anything missing as [NEEDED].","type": "textarea","optional": false,"ph": "VOICE BRIEF"},{"key": "task","label": "What should AI write, for whom, how long, in which language?","help": "","example": "A short reminder email to a client, in English, under 80 words","type": "text","optional": false,"ph": "TASK"},{"key": "facts","label": "The confirmed facts for this piece","help": "Leave out anything you haven't confirmed. AI will mark it [NEEDED].","example": "Client Sam needs to send this quarter's receipts. We check the figures and say if anything is missing. Sam can reply with questions. Deadline date not confirmed.","type": "textarea","optional": false,"ph": "FACTS"},{"key": "business","label": "Describe your business in one sentence.","help": "Saved in your profile if you choose. No customer details or passwords here.","example": "A two-person bookkeeping firm for small businesses in Leeds, UK","type": "text","optional": true,"ph": "ABOUT YOUR BUSINESS"}],"template": ["About my business: {business}","My brand voice brief: {header}","","Task: {task}.","Facts: {facts}","","Write the draft in my voice, following every rule in the brief. Use only these facts. Do not invent names, dates, prices, fees, offers, results or reviews to fit the style. If something essential is missing, write [NEEDED: ...] instead of guessing."],"example_values": {"header": "Who we write for: small business owners who'd rather not think about bookkeeping. Our voice: friendly but not chummy; clear but not cold; calm but not vague. Words we use: sorted, no rush, here's what happens next. Words we avoid: leverage, thrilled, dear valued client. House rules: UK spelling; dates as 14 March; one exclamation mark at most; open \"Hi [NAME],\" and sign off \"Speak soon, Priya\". Facts rule: keep my facts exactly; mark anything missing as [NEEDED].","task": "A short reminder email to a client, in English, under 80 words","facts": "Client Sam needs to send this quarter's receipts. We check the figures and say if anything is missing. Sam can reply with questions. Deadline date not confirmed.","business": "A two-person bookkeeping firm for small businesses in Leeds, UK"},"example_answer": "Hi Sam, a quick reminder to send over your receipts for this quarter by [NEEDED: deadline date]. Here's what happens next: once we have them, we'll check the figures and let you know if anything's missing. Any questions, just reply to this email. Speak soon, Priya","checks": ["Every fact matches your records; nothing new was added.","Anything unconfirmed is marked [NEEDED].","It follows your voice words and house rules.","None of your avoided words appear."],"repairs": [["Invented or changed a fact","Replace this assumption with the following confirmed fact: [FACT]. Change nothing else."],["Tone is off","Make this sound [VOICE WORD] but not [NOT WORD]. Keep every fact exactly the same."],["Used an avoided word","Remove \"[WORD]\". It is on my avoid list. Use plainer words and change nothing else."]],"next": "Fill every [NEEDED] gap with a confirmed fact, read the draft aloud, then send or publish it yourself."},{"id": "check","title": "Check a draft against your voice brief","when": "You have a draft, from AI or a colleague, and want to see where it drifts from your voice.","prepare": ["Your voice brief","The draft to check"],"questions": [{"key": "brief","label": "Paste your voice brief","help": "","example": "Who we write for: small business owners who'd rather not think about bookkeeping. Our voice: friendly but not chummy; clear but not cold; calm but not vague. Words we use: sorted, no rush, here's what happens next. Words we avoid: leverage, thrilled, dear valued client. House rules: UK spelling; dates as 14 March; one exclamation mark at most; open \"Hi [NAME],\" and sign off \"Speak soon, Priya\". Facts rule: keep my facts exactly; mark anything missing as [NEEDED].","type": "textarea","optional": false,"ph": "VOICE BRIEF"},{"key": "draft","label": "Paste the draft to check","help": "Remove customer names and contact details first.","example": "Dear valued client, we are thrilled to remind you that your quarterly receipts are due! Please do not hesitate to reach out. We leverage the latest tools to make your finances stress-free!! Kind regards, Northgate Bookkeeping","type": "textarea","optional": false,"ph": "DRAFT"},{"key": "business","label": "Describe your business in one sentence.","help": "Saved in your profile if you choose. No customer details or passwords here.","example": "A two-person bookkeeping firm for small businesses in Leeds, UK","type": "text","optional": true,"ph": "ABOUT YOUR BUSINESS"}],"template": ["About my business: {business}","My brand voice brief: {brief}","The draft: {draft}","","Quote every phrase in the draft that breaks my brief: avoided words, wrong spelling style, wrong tone, punctuation rules, opening or sign-off. For each one, say which rule it breaks. Then list any names, dates, numbers or promises in the draft so I can check them against my own records. Do not rewrite the draft."],"example_values": {"brief": "Who we write for: small business owners who'd rather not think about bookkeeping. Our voice: friendly but not chummy; clear but not cold; calm but not vague. Words we use: sorted, no rush, here's what happens next. Words we avoid: leverage, thrilled, dear valued client. House rules: UK spelling; dates as 14 March; one exclamation mark at most; open \"Hi [NAME],\" and sign off \"Speak soon, Priya\". Facts rule: keep my facts exactly; mark anything missing as [NEEDED].","draft": "Dear valued client, we are thrilled to remind you that your quarterly receipts are due! Please do not hesitate to reach out. We leverage the latest tools to make your finances stress-free!! Kind regards, Northgate Bookkeeping","business": "A two-person bookkeeping firm for small businesses in Leeds, UK"},"example_answer": "Breaks the brief: \"Dear valued client\" (avoided phrase; opening should be \"Hi [NAME],\"); \"thrilled\" and \"leverage\" (avoided words); \"due!\" and \"stress-free!!\" (more than one exclamation mark); \"Kind regards, Northgate Bookkeeping\" (sign-off should be \"Speak soon, Priya\"); \"stress-free\" (a promise not in the brief's facts). Check yourself: no deadline date is given; confirm it before sending.","checks": ["Every flagged phrase is fixed or removed.","Any promise or claim is one you can back up.","Names, dates and numbers match your records.","The fixed draft still says the same thing."],"repairs": [["Tone is off","Make this sound [VOICE WORD] but not [NOT WORD]. Keep every fact exactly the same."],["Used an avoided word","Remove \"[WORD]\". It is on my avoid list. Use plainer words and change nothing else."],["Missed something","You missed this phrase: \"[PHRASE]\". Check it against my brief and tell me which rule it breaks, if any. Do not rewrite the draft."]],"next": "Fix each flagged phrase, confirm the facts against your records, then send or publish the draft yourself."}]};const DEMO=false;const BUY="";const EXTRA={};</script><script>

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Copied')}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Copied')}catch(_){toast('Select the text and copy it')}t.remove()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(!b)return;const src=b.dataset.copy;const el=src.startsWith('#')?$(src):null;copy(el?(el.value??el.textContent):src)});
function go(h){location.hash=h}
const back=h=>`<button class="btn sec" onclick="history.length>1?history.back():go('${h}')">&larr; Back</button>`;
function checks(list,id){return `<ul class="checks" id="${id}">`+list.map((c,i)=>`<li><label><input type="checkbox" data-ck="${id}">${esc(c)}</label></li>`).join('')+`</ul><p class="small" id="${id}-s"></p>`}
document.addEventListener('change',e=>{const id=e.target.dataset.ck;if(!id)return;const all=[...document.querySelectorAll(`[data-ck="${id}"]`)];const s=document.getElementById(id+'-s');if(s)s.textContent=all.every(x=>x.checked)?'All checks done. You can use this result.':`${all.filter(x=>x.checked).length} of ${all.length} checks done.`});
function handoff(){return '<ol class="hand">'+D.handoff.map(([a,b])=>`<li><b>${esc(a)}.</b> ${esc(b)}</li>`).join('')+'</ol>'}
const FW=D.first_win;
function fw(n){
 const total=5, p=`<div class="small">First win · step ${n} of ${total}</div><div class="prog"><i style="width:${n/total*100}%"></i></div>`;
 const nextH=n<total?`#fw/${n+1}`:(DEMO?'#end':(D.craft?'#craft':'#tasks')), nextL=n<total?'Next':(DEMO?'Finish':(D.craft?'Next: why it worked':'Next: choose your real task'));
 let b='';
 if(n==1)b=`<span class="badge">${esc(FW.label)}</span><h2>Step 1: ${esc(FW.step1_title||'The example')}</h2><p>${esc(FW.intro)}</p><div class="inputs">${FW.inputs.map(([k,v])=>`<div><b>${esc(k)}</b>${esc(v)}</div>`).join('')}</div><p class="small">You will do the same with your own task afterwards.</p>`;
 if(n==2)b=`<span class="badge">${esc(FW.label)}</span><h2>Step 2: The completed prompt</h2><p>These facts are turned into a complete prompt. The last line stops the AI from inventing anything.</p><div class="prompt" id="fwp">${esc(FW.prompt)}</div><button class="btn teal" data-copy="#fwp">Copy prompt</button>`;
 if(n==3)b=`<h2>Step 3: Hand it to your AI assistant</h2><p>This guide prepares the prompt. You use it in the AI assistant you already have.</p>${handoff()}<div class="tip">${esc(D.privacy)}</div>`;
 if(n==4)b=`<h2>Step 4: The answer you might get</h2><div class="answer"><span class="lbl">${esc(FW.answer_label)}</span>${esc(FW.answer)}</div><p class="small">Real AI answers vary. Yours may be worded differently; what matters is the check in the next step.</p>`;
 if(n==5)b=`<h2>Step 5: Check before use</h2><p>Tick each check against the real facts, not against what the AI says.</p>${checks(FW.checks,'fwc')}<div class="tip"><b>Use it:</b> ${esc(FW.use)}</div><button class="btn sec sm" data-copy="${esc(FW.answer)}">${esc(FW.copy_label||'Copy the example answer')}</button>`;
 return `<div class="card">${p}${b}<div class="bar">${n>1?back('#fw/'+(n-1)):''}<span class="grow"></span><a class="btn" href="${nextH}">${nextL} &rarr;</a></div></div>`;
}
function start(){
 return `<div class="card"><span class="kicker">${DEMO?'Free demo · no sign-up':'Your working guide'}</span><h1>${esc(DEMO?D.meta.demo_title:D.meta.web_title)}</h1>
 <p>${esc(DEMO?D.meta.demo_intro:(D.meta.web_intro||'Success is not just an AI answer. It is a useful result that you have checked. Work through these steps in order:'))}</p>
 ${DEMO?'':'<ol class="hand">'+D.order.map(s=>`<li>${esc(s)}</li>`).join('')+'</ol>'}
 <div class="bar"><a class="btn" href="#fw/1">Start the first win &rarr;</a>${DEMO?'':'<a class="btn sec" href="#tasks">Skip to my task</a>'}</div></div>`;
}
function craft(){const C=D.craft;return `<div class="card"><span class="kicker">Why it worked</span><h2>The C.R.A.F.T. formula</h2><p>${esc(C.intro)}</p>
 <table><tr><th></th><th>Means</th><th>Ask yourself</th></tr>${C.rows.map(r=>`<tr><td><b>${r[0]}</b></td><td><b>${esc(r[1])}</b><br><span class="small">${esc(r[3])}</span></td><td>${esc(r[2])}</td></tr>`).join('')}</table>
 <div class="tip">${esc(C.in_first_win)}</div><h3>Master template</h3><div class="prompt" id="crt">${hl(C.template)}</div><button class="btn sec sm" data-copy="#crt">Copy template</button>
 <div class="bar"><span class="grow"></span><a class="btn" href="#tasks">Choose your real task &rarr;</a></div></div>`}
function tasks(){return `<div class="card"><span class="kicker">Step 2</span><h2>What do you need to do today?</h2><p>Pick one. You'll answer a few short questions, one at a time, then get a prompt to copy.</p>
 <div class="tasks">${D.tasks.map(t=>`<a class="task" href="#t/${t.id}/intro"><b>${esc(t.title)}</b><span class="small">${esc(t.when)}</span><br>${t.source?`<span class="chip">Based on prompt #${t.source}</span>`:''}</a>`).join('')}</div></div>`}
const T=id=>D.tasks.find(t=>t.id==id);
function prof(){return LS.get(PK,{})}
function langField(q,v){const opts=['English','Chinese (Simplified)','Portuguese','Italian','Dutch','Spanish','French','German','Arabic','Hindi'];
 return `<input type="text" id="qv" list="langs" value="${esc(v)}" placeholder="e.g. English"><datalist id="langs">${opts.map(o=>`<option value="${o}">`).join('')}</datalist>`}
function question(t,i){
 const qs=t.questions,q=qs[i],a=ans[t.id]||(ans[t.id]={});const pr=prof();
 if(a[q.key]===undefined){const m={business:pr.business,tone:pr.tone,lang:pr.lang}[q.key];if(m)a[q.key]=m}
 const v=a[q.key]||'';const input=q.type=='textarea'?`<textarea class="in" id="qv">${esc(v)}</textarea>`:q.type=='lang'?langField(q,v):`<input type="text" id="qv" value="${esc(v)}">`;
 return `<div class="card"><div class="small">${esc(t.title)} · question ${i+1} of ${qs.length}</div><div class="prog"><i style="width:${(i+1)/(qs.length+1)*100}%"></i></div>
 <label class="q" for="qv">${esc(q.label)}${q.optional?' <span class="small">(optional)</span>':''}</label>${q.help?`<p class="small">${esc(q.help)}</p>`:''}${input}
 <div class="ex"><b>Example:</b> ${esc(q.example)} <button class="btn sec sm" id="useex" style="margin-left:6px">Use example</button></div>
 <div class="bar">${back(i?`#t/${t.id}/${i-1}`:`#t/${t.id}/intro`)}<span class="grow"></span><button class="btn" id="qn">${i<qs.length-1?'Next':'Build my prompt'} &rarr;</button></div></div>`;
}
function bindQ(t,i){const q=t.questions[i],a=ans[t.id];const el=$('#qv');el.focus({preventScroll:true});
 const save=()=>{a[q.key]=el.value.trim()};el.addEventListener('input',save);
 $('#useex').onclick=()=>{el.value=q.example;save()};
 $('#qn').onclick=()=>{save();if(!a[q.key]&&!q.optional){if(!confirm('This fact is needed for an accurate result. Continue anyway? The prompt will mark it [FILL IN] so the AI asks you for it.'))return}
  go(i<t.questions.length-1?`#t/${t.id}/${i+1}`:`#t/${t.id}/done`)};
 el.addEventListener('keydown',e=>{if(e.key=='Enter'&&el.tagName=='INPUT'){e.preventDefault();$('#qn').click()}})}
function buildPrompt(t,vals){const out=[];for(const line of t.template){const keys=[...line.matchAll(/\{(\w+)\}/g)].map(m=>m[1]);let skip=false;
 const s=line.replace(/\{(\w+)\}/g,(_,k)=>{const q=t.questions.find(x=>x.key==k);const v=(vals[k]||'').trim();if(v)return v;if(q&&q.optional){skip=true;return''}return `[FILL IN: ${(q&&q.ph)||(D.placeholders||{})[k]||(q?q.label.replace(/\?$/,''):k)}]`});
 if(!skip)out.push(s)}return out.join('\n').replace(/\n{3,}/g,'\n\n').trim()}
function intro(t){return `<div class="card"><span class="kicker">Guided task${t.source?' · prompt #'+t.source:''}</span><h2>${esc(t.title)}</h2><p><b>When to use it:</b> ${esc(t.when)}</p><h3>What to prepare</h3><ul>${t.prepare.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
 <div class="tip">${esc(D.privacy)}</div><div class="bar">${back('#tasks')}<span class="grow"></span><a class="btn" href="#t/${t.id}/0">Start: ${t.questions.length} short questions &rarr;</a></div></div>`}
function done(t){const a=ans[t.id]||{};const p=buildPrompt(t,a);const miss=(p.match(/\[FILL IN/g)||[]).length;
 return `<div class="card"><span class="kicker">${esc(t.title)} · your prompt</span><h2>Check and copy your prompt</h2><p class="small">You can edit the text below before copying. Edits are not saved.</p>
 ${miss?`<div class="note">${miss} fact(s) are marked [FILL IN]. Fill them in here, or the AI should ask you for them. Never let it guess.</div>`:''}
 <textarea class="prompt" id="tp">${esc(p)}</textarea><div class="bar"><button class="btn teal" data-copy="#tp">Copy prompt</button>${back(`#t/${t.id}/${t.questions.length-1}`)}</div></div>
 <div class="card"><h3>Use it in your AI assistant</h3>${handoff()}<div class="tip">${esc(D.privacy)}</div></div>
 <div class="card"><h3>What a good answer looks like</h3><div class="answer"><span class="lbl">Illustrative answer, not a live AI result</span>${esc(t.example_answer)}</div><p class="small">Based on the example answers to each question, not your own. Your AI's answer will differ.</p></div>
 <div class="card"><h3>Check before use</h3><p>Compare against your own records: ${esc(D.verify)}</p>${checks(t.checks,'tc-'+t.id)}</div>
 <div class="card"><h3>If something is wrong, send a repair</h3><p class="small">Copy one, fill in the brackets, and send it in the same AI chat.</p>
 ${t.repairs.concat(D.repairs_general.slice(0,4)).map(([w,r],i)=>`<div class="rep"><b>${esc(w)}</b><code id="rp${i}">${hl(r)}</code><button class="btn sec sm" data-copy="#rp${i}">Copy</button></div>`).join('')}</div>
 <div class="card"><h3>Next action</h3><p><b>${esc(t.next)}</b> This page never sends anything for you.</p>
 <div class="bar"><a class="btn sec" href="#profile">Save my business details (optional)</a><a class="btn sec" href="#tasks">Do another task</a>${LIBN?`<a class="btn" href="#library">Explore the ${LIBN}-prompt library &rarr;</a>`:''}</div></div>`}
function library(){const my=LS.get(MK,[]);
 return `<div class="card"><span class="kicker">Reference</span><h2>The ${LIBN}-prompt library</h2><p class="small">Replace each <span class="fill">[BRACKET]</span> with your confirmed facts. Tap ☆ to keep a prompt in My prompts (saved on this device only).</p>
 <input type="search" id="q" placeholder="Search prompts, e.g. invoice, review, caption"><p class="small" id="cnt"></p></div>
 <div id="libl">${D.library.map((c,ci)=>`<div class="card lib" data-cat><h3>${ci+1}. ${esc(c.name)}</h3><p class="small">${esc(c.intro)}</p>${c.prompts.map(p=>`<div class="p" data-t="${esc((p.name+' '+p.text+' '+c.name).toLowerCase())}"><span class="n">${p.n}</span><b>${esc(p.name)}</b>${LC[p.n]?' <span class="chip">Improved</span>':''}<div id="lp${p.n}" style="margin:6px 0">${hl(p.text)}</div><button class="btn sec sm" data-copy="#lp${p.n}">Copy</button> <button class="btn sec sm" data-star="${p.n}">${my.some(m=>m.n==p.n)?'★ Saved':'☆ Save'}</button></div>`).join('')}</div>`).join('')}</div>`}
function bindLib(){const q=$('#q');const f=()=>{const v=q.value.trim().toLowerCase();let n=0;document.querySelectorAll('.lib .p').forEach(p=>{const s=!v||p.dataset.t.includes(v);p.style.display=s?'':'none';n+=s});document.querySelectorAll('[data-cat]').forEach(c=>c.style.display=[...c.querySelectorAll('.p')].some(p=>p.style.display!='none')?'':'none');$('#cnt').textContent=`${n} of ${LIBN} prompts`};q.addEventListener('input',f);f()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-star]');if(!b)return;const n=+b.dataset.star;let my=LS.get(MK,[]);
 if(my.some(m=>m.n==n)){my=my.filter(m=>m.n!=n);b.textContent='☆ Save'}else{const p=D.library.flatMap(c=>c.prompts).find(p=>p.n==n);my.push({n,name:p.name,text:p.text,note:''});b.textContent='★ Saved'}LS.set(MK,my)});
function mine(){const my=LS.get(MK,[]);return `<div class="card"><span class="kicker">My prompts</span><h2>Your personal prompt collection</h2><p class="small">Saved only in this browser on this device. Keep the [BRACKETS] here and fill in real facts each time; don't store customer details.</p>
 ${my.length?my.map((m,i)=>`<div class="rep"><b>#${m.n} ${esc(m.name)}</b><code id="mp${i}">${hl(m.text)}</code><input type="text" data-note="${i}" value="${esc(m.note)}" placeholder="When I use it (e.g. Monday mornings)"><div class="bar"><button class="btn sec sm" data-copy="#mp${i}">Copy</button><button class="btn warn sm" data-rm="${i}">Remove</button></div></div>`).join(''):'<p>No saved prompts yet. Tap ☆ Save in the <a href="#library">library</a>.</p>'}
 ${my.length?'<button class="btn warn" id="clrm">Forget all my saved prompts</button>':''}</div>`}
function bindMine(){document.querySelectorAll('[data-note]').forEach(i=>i.addEventListener('input',()=>{const my=LS.get(MK,[]);my[+i.dataset.note].note=i.value.slice(0,120);LS.set(MK,my)}));
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const my=LS.get(MK,[]);my.splice(+b.dataset.rm,1);LS.set(MK,my);render()});
 const c=$('#clrm');if(c)c.onclick=()=>{LS.del(MK);toast('Saved prompts removed');render()}}
function profile(){const p=prof();return `<div class="card"><span class="kicker">Optional</span><h2>Your business profile</h2><p>${esc(D.profile_note)}</p>
 <label class="q" for="pb">Business description</label><input type="text" id="pb" value="${esc(p.business)}" placeholder="A family-run shoe store in Denver">
 <label class="q" for="pt">Preferred tone</label><input type="text" id="pt" value="${esc(p.tone)}" placeholder="Friendly and clear">
 <label class="q" for="pl">Preferred reply language</label>${langField({}, p.lang||'').replace('id="qv"','id="pl"')}
 <div class="bar"><button class="btn" id="psave">Save on this device</button><button class="btn warn" id="pforget">Forget my details and saved prompts</button></div><p class="small" id="pst">${Object.keys(p).length?'Details are saved on this device.':'Nothing saved.'}</p>
 <div class="tip">${esc(D.privacy)}</div></div>`}
function bindProfile(){$('#psave').onclick=()=>{const p={business:$('#pb').value.trim().slice(0,200),tone:$('#pt').value.trim().slice(0,60),lang:$('#pl').value.trim().slice(0,40)};Object.keys(p).forEach(k=>!p[k]&&delete p[k]);LS.set(PK,p);$('#pst').textContent='Saved on this device.';toast('Saved')};
 $('#pforget').onclick=()=>{LS.del(PK);LS.del(MK);['#pb','#pt','#pl'].forEach(s=>$(s).value='');$('#pst').textContent='Forgotten: your profile and saved prompts are removed from this device.';toast('Details and saved prompts forgotten')}}
function practice(){const P=D.practice;return `<div class="card"><span class="kicker">Practice</span><h2>Your 7-day challenge</h2><p>${esc(P.intro)}</p><table><tr><th>Day</th><th>Do this</th><th>Use</th></tr>${P.days.map(d=>`<tr><td>${d[0]}</td><td>${esc(d[1])}</td><td>${esc(d[2])}</td></tr>`).join('')}</table>
 <h3 style="margin-top:14px">Repairs that work for any task</h3>${D.repairs_general.map(([w,r],i)=>`<div class="rep"><b>${esc(w)}</b><code id="gr${i}">${hl(r)}</code><button class="btn sec sm" data-copy="#gr${i}">Copy</button></div>`).join('')}<div class="note">${esc(D.verify)}</div></div>`}
function end(){const X=(typeof EXTRA!=='undefined'&&EXTRA)||{};const fw=D.first_win||{};return `<div class="card"><span class="kicker">You did it</span><h2>That's a complete, checked AI task.</h2>
 <p><b>What you just did:</b> you gave the AI only confirmed facts, got a draft, and checked it before use${fw.checks?` (${fw.checks.length} checks)`:''}. That is the whole method.</p>
 <p><b>What the full guide adds:</b> ${esc(D.meta.demo_pitch)}</p>
 <div class="bar"><a class="btn" href="${BUY}">Get the full guide · USD 2.70</a>${X.guide?`<a class="btn sec" href="${X.guide}">See what's inside</a>`:''}</div>
 <p class="small">Secure checkout by Stripe. Instant access after payment.${X.support?` Not useful? Email ${esc(X.support)} within 7 days for a refund.`:''}</p>
 ${X.bundle?`<div class="tip"><b>Want every guide?</b> The All-Access Library is USD ${X.bundle_price} for every current guide plus every future release. <a href="${X.bundle}">Get All-Access →</a></div>`:''}
 <p class="small"><a href="/catalog.html">Browse the library</a></p></div>`}
const TABS=DEMO?[]:[['#start','Start'],['#fw/1','First win'],D.craft&&['#craft','C.R.A.F.T.'],['#tasks','Tasks'],LIBN&&['#library','Library'],D.practice&&['#practice','Practice'],LIBN&&['#mine','My prompts'],['#profile','Profile']].filter(Boolean);
function render(){const h=location.hash||'#start';const [r,a,b]=h.slice(1).split('/');let html='',bind=null;
 if(r=='fw')html=fw(Math.min(5,Math.max(1,+a||1)));
 else if(DEMO&&r=='end')html=end();
 else if(!DEMO&&r=='craft'&&D.craft)html=craft();
 else if(!DEMO&&r=='tasks')html=tasks();
 else if(!DEMO&&r=='t'&&T(a)){const t=T(a);if(b=='intro')html=intro(t);else if(b=='done')html=done(t);else{const i=Math.min(t.questions.length-1,Math.max(0,+b||0));html=question(t,i);bind=()=>bindQ(t,i)}}
 else if(!DEMO&&r=='library'&&LIBN){html=library();bind=bindLib}
 else if(!DEMO&&r=='mine'&&LIBN){html=mine();bind=bindMine}
 else if(!DEMO&&r=='profile'){html=profile();bind=bindProfile}
 else if(!DEMO&&r=='practice'&&D.practice)html=practice();
 else html=start();
 app.innerHTML=html;if(bind)bind();
 const tabs=$('#tabs');if(tabs)tabs.innerHTML=TABS.map(([k,l])=>`<a href="${k}" class="${('#'+r).startsWith(k.split('/')[0])&&(k!='#start'||r=='start'||!r)?'on':''}">${l}</a>`).join('');
 window.scrollTo(0,0)}
addEventListener('hashchange',render);render();
</script></body></html>
