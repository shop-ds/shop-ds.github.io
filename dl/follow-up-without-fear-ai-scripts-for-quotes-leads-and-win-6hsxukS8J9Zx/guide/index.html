const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hl=s=>esc(s).replace(/\[([^\]]+)\]/g,'<span class="fill">[$1]</span>');
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const SP=(D.meta&&D.meta.storage)||'cc50', PK=SP+'.profile', MK=SP+'.myprompts';
const LIBN=(D.library||[]).reduce((n,c)=>n+c.prompts.length,0), LC=D.library_changes||{};
const ans={}; // task answers: memory only, never stored
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Copied')}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Copied')}catch(_){toast('Select the text and copy it')}t.remove()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(!b)return;const src=b.dataset.copy;const el=src.startsWith('#')?$(src):null;copy(el?(el.value??el.textContent):src)});
function go(h){location.hash=h}
const back=h=>`<button class="btn sec" onclick="history.length>1?history.back():go('${h}')">&larr; Back</button>`;
function checks(list,id){return `<ul class="checks" id="${id}">`+list.map((c,i)=>`<li><label><input type="checkbox" data-ck="${id}">${esc(c)}</label></li>`).join('')+`</ul><p class="small" id="${id}-s"></p>`}
document.addEventListener('change',e=>{const id=e.target.dataset.ck;if(!id)return;const all=[...document.querySelectorAll(`[data-ck="${id}"]`)];const s=document.getElementById(id+'-s');if(s)s.textContent=all.every(x=>x.checked)?'All checks done. You can use this result.':`${all.filter(x=>x.checked).length} of ${all.length} checks done.`});
function handoff(){return '<ol class="hand">'+D.handoff.map(([a,b])=>`<li><b>${esc(a)}.</b> ${esc(b)}</li>`).join('')+'</ol>'}
const FW=D.first_win;
function fw(n){
 const total=5, p=`<div class="small">First win · step ${n} of ${total}</div><div class="prog"><i style="width:${n/total*100}%"></i></div>`;
 const nextH=n<total?`#fw/${n+1}`:(DEMO?'#end':(D.craft?'#craft':'#tasks')), nextL=n<total?'Next':(DEMO?'Finish':(D.craft?'Next: why it worked':'Next: choose your real task'));
 let b='';
 if(n==1)b=`<span class="badge">${esc(FW.label)}</span><h2>Step 1: ${esc(FW.step1_title||'The example')}</h2><p>${esc(FW.intro)}</p><div class="inputs">${FW.inputs.map(([k,v])=>`<div><b>${esc(k)}</b>${esc(v)}</div>`).join('')}</div><p class="small">You will do the same with your own task afterwards.</p>`;
 if(n==2)b=`<span class="badge">${esc(FW.label)}</span><h2>Step 2: The completed prompt</h2><p>These facts are turned into a complete prompt. The last line stops the AI from inventing anything.</p><div class="prompt" id="fwp">${esc(FW.prompt)}</div><button class="btn teal" data-copy="#fwp">Copy prompt</button>`;
 if(n==3)b=`<h2>Step 3: Hand it to your AI assistant</h2><p>This guide prepares the prompt. You use it in the AI assistant you already have.</p>${handoff()}<div class="tip">${esc(D.privacy)}</div>`;
 if(n==4)b=`<h2>Step 4: The answer you might get</h2><div class="answer"><span class="lbl">${esc(FW.answer_label)}</span>${esc(FW.answer)}</div><p class="small">Real AI answers vary. Yours may be worded differently; what matters is the check in the next step.</p>`;
 if(n==5)b=`<h2>Step 5: Check before use</h2><p>Tick each check against the real facts, not against what the AI says.</p>${checks(FW.checks,'fwc')}<div class="tip"><b>Use it:</b> ${esc(FW.use)}</div><button class="btn sec sm" data-copy="${esc(FW.answer)}">${esc(FW.copy_label||'Copy the example answer')}</button>`;
 return `<div class="card">${p}${b}<div class="bar">${n>1?back('#fw/'+(n-1)):''}<span class="grow"></span><a class="btn" href="${nextH}">${nextL} &rarr;</a></div></div>`;
}
function start(){
 return `<div class="card"><span class="kicker">${DEMO?'Free demo · no sign-up':'Your working guide'}</span><h1>${esc(DEMO?D.meta.demo_title:D.meta.web_title)}</h1>
 <p>${esc(DEMO?D.meta.demo_intro:(D.meta.web_intro||'Success is not just an AI answer. It is a useful result that you have checked. Work through these steps in order:'))}</p>
 ${DEMO?'':'<ol class="hand">'+D.order.map(s=>`<li>${esc(s)}</li>`).join('')+'</ol>'}
 <div class="bar"><a class="btn" href="#fw/1">Start the first win &rarr;</a>${DEMO?'':'<a class="btn sec" href="#tasks">Skip to my task</a>'}</div></div>`;
}
function craft(){const C=D.craft;return `<div class="card"><span class="kicker">Why it worked</span><h2>The C.R.A.F.T. formula</h2><p>${esc(C.intro)}</p>
 <table><tr><th></th><th>Means</th><th>Ask yourself</th></tr>${C.rows.map(r=>`<tr><td><b>${r[0]}</b></td><td><b>${esc(r[1])}</b><br><span class="small">${esc(r[3])}</span></td><td>${esc(r[2])}</td></tr>`).join('')}</table>
 <div class="tip">${esc(C.in_first_win)}</div><h3>Master template</h3><div class="prompt" id="crt">${hl(C.template)}</div><button class="btn sec sm" data-copy="#crt">Copy template</button>
 <div class="bar"><span class="grow"></span><a class="btn" href="#tasks">Choose your real task &rarr;</a></div></div>`}
function tasks(){return `<div class="card"><span class="kicker">Step 2</span><h2>What do you need to do today?</h2><p>Pick one. You'll answer a few short questions, one at a time, then get a prompt to copy.</p>
 <div class="tasks">${D.tasks.map(t=>`<a class="task" href="#t/${t.id}/intro"><b>${esc(t.title)}</b><span class="small">${esc(t.when)}</span><br>${t.source?`<span class="chip">Based on prompt #${t.source}</span>`:''}</a>`).join('')}</div></div>`}
const T=id=>D.tasks.find(t=>t.id==id);
function prof(){return LS.get(PK,{})}
function langField(q,v){const opts=['English','Chinese (Simplified)','Tamil','Indonesian','Spanish','French','German','Arabic','Hindi'];
 return `<input type="text" id="qv" list="langs" value="${esc(v)}" placeholder="e.g. English"><datalist id="langs">${opts.map(o=>`<option value="${o}">`).join('')}</datalist>`}
function question(t,i){
 const qs=t.questions,q=qs[i],a=ans[t.id]||(ans[t.id]={});const pr=prof();
 if(a[q.key]===undefined){const m={business:pr.business,tone:pr.tone,lang:pr.lang}[q.key];if(m)a[q.key]=m}
 const v=a[q.key]||'';const input=q.type=='textarea'?`<textarea class="in" id="qv">${esc(v)}</textarea>`:q.type=='lang'?langField(q,v):`<input type="text" id="qv" value="${esc(v)}">`;
 return `<div class="card"><div class="small">${esc(t.title)} · question ${i+1} of ${qs.length}</div><div class="prog"><i style="width:${(i+1)/(qs.length+1)*100}%"></i></div>
 <label class="q" for="qv">${esc(q.label)}${q.optional?' <span class="small">(optional)</span>':''}</label>${q.help?`<p class="small">${esc(q.help)}</p>`:''}${input}
 <div class="ex"><b>Example:</b> ${esc(q.example)} <button class="btn sec sm" id="useex" style="margin-left:6px">Use example</button></div>
 <div class="bar">${back(i?`#t/${t.id}/${i-1}`:`#t/${t.id}/intro`)}<span class="grow"></span><button class="btn" id="qn">${i<qs.length-1?'Next':'Build my prompt'} &rarr;</button></div></div>`;
}
function bindQ(t,i){const q=t.questions[i],a=ans[t.id];const el=$('#qv');el.focus({preventScroll:true});
 const save=()=>{a[q.key]=el.value.trim()};el.addEventListener('input',save);
 $('#useex').onclick=()=>{el.value=q.example;save()};
 $('#qn').onclick=()=>{save();if(!a[q.key]&&!q.optional){if(!confirm('This fact is needed for an accurate result. Continue anyway? The prompt will mark it [FILL IN] so the AI asks you for it.'))return}
  go(i<t.questions.length-1?`#t/${t.id}/${i+1}`:`#t/${t.id}/done`)};
 el.addEventListener('keydown',e=>{if(e.key=='Enter'&&el.tagName=='INPUT'){e.preventDefault();$('#qn').click()}})}
function buildPrompt(t,vals){const out=[];for(const line of t.template){const keys=[...line.matchAll(/\{(\w+)\}/g)].map(m=>m[1]);let skip=false;
 const s=line.replace(/\{(\w+)\}/g,(_,k)=>{const q=t.questions.find(x=>x.key==k);const v=(vals[k]||'').trim();if(v)return v;if(q&&q.optional){skip=true;return''}return `[FILL IN: ${(q&&q.ph)||(D.placeholders||{})[k]||(q?q.label.replace(/\?$/,''):k)}]`});
 if(!skip)out.push(s)}return out.join('\n').replace(/\n{3,}/g,'\n\n').trim()}
function intro(t){return `<div class="card"><span class="kicker">Guided task${t.source?' · prompt #'+t.source:''}</span><h2>${esc(t.title)}</h2><p><b>When to use it:</b> ${esc(t.when)}</p><h3>What to prepare</h3><ul>${t.prepare.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
 <div class="tip">${esc(D.privacy)}</div><div class="bar">${back('#tasks')}<span class="grow"></span><a class="btn" href="#t/${t.id}/0">Start: ${t.questions.length} short questions &rarr;</a></div></div>`}
function done(t){const a=ans[t.id]||{};const p=buildPrompt(t,a);const miss=(p.match(/\[FILL IN/g)||[]).length;
 return `<div class="card"><span class="kicker">${esc(t.title)} · your prompt</span><h2>Check and copy your prompt</h2><p class="small">You can edit the text below before copying. Edits are not saved.</p>
 ${miss?`<div class="note">${miss} fact(s) are marked [FILL IN]. Fill them in here, or the AI should ask you for them. Never let it guess.</div>`:''}
 <textarea class="prompt" id="tp">${esc(p)}</textarea><div class="bar"><button class="btn teal" data-copy="#tp">Copy prompt</button>${back(`#t/${t.id}/${t.questions.length-1}`)}</div></div>
 <div class="card"><h3>Use it in your AI assistant</h3>${handoff()}<div class="tip">${esc(D.privacy)}</div></div>
 <div class="card"><h3>What a good answer looks like</h3><div class="answer"><span class="lbl">Illustrative answer, not a live AI result</span>${esc(t.example_answer)}</div><p class="small">Based on the example answers to each question, not your own. Your AI's answer will differ.</p></div>
 <div class="card"><h3>Check before use</h3><p>Compare against your own records: ${esc(D.verify)}</p>${checks(t.checks,'tc-'+t.id)}</div>
 <div class="card"><h3>If something is wrong, send a repair</h3><p class="small">Copy one, fill in the brackets, and send it in the same AI chat.</p>
 ${t.repairs.concat(D.repairs_general.slice(0,4)).map(([w,r],i)=>`<div class="rep"><b>${esc(w)}</b><code id="rp${i}">${hl(r)}</code><button class="btn sec sm" data-copy="#rp${i}">Copy</button></div>`).join('')}</div>
 <div class="card"><h3>Next action</h3><p><b>${esc(t.next)}</b> This page never sends anything for you.</p>
 <div class="bar"><a class="btn sec" href="#profile">Save my business details (optional)</a><a class="btn sec" href="#tasks">Do another task</a>${LIBN?`<a class="btn" href="#library">Explore the ${LIBN}-prompt library &rarr;</a>`:''}</div></div>`}
function library(){const my=LS.get(MK,[]);
 return `<div class="card"><span class="kicker">Reference</span><h2>The ${LIBN}-prompt library</h2><p class="small">Replace each <span class="fill">[BRACKET]</span> with your confirmed facts. Tap ☆ to keep a prompt in My prompts (saved on this device only).</p>
 <input type="search" id="q" placeholder="Search prompts, e.g. invoice, review, caption"><p class="small" id="cnt"></p></div>
 <div id="libl">${D.library.map((c,ci)=>`<div class="card lib" data-cat><h3>${ci+1}. ${esc(c.name)}</h3><p class="small">${esc(c.intro)}</p>${c.prompts.map(p=>`<div class="p" data-t="${esc((p.name+' '+p.text+' '+c.name).toLowerCase())}"><span class="n">${p.n}</span><b>${esc(p.name)}</b>${LC[p.n]?' <span class="chip">Improved</span>':''}<div id="lp${p.n}" style="margin:6px 0">${hl(p.text)}</div><button class="btn sec sm" data-copy="#lp${p.n}">Copy</button> <button class="btn sec sm" data-star="${p.n}">${my.some(m=>m.n==p.n)?'★ Saved':'☆ Save'}</button></div>`).join('')}</div>`).join('')}</div>`}
function bindLib(){const q=$('#q');const f=()=>{const v=q.value.trim().toLowerCase();let n=0;document.querySelectorAll('.lib .p').forEach(p=>{const s=!v||p.dataset.t.includes(v);p.style.display=s?'':'none';n+=s});document.querySelectorAll('[data-cat]').forEach(c=>c.style.display=[...c.querySelectorAll('.p')].some(p=>p.style.display!='none')?'':'none');$('#cnt').textContent=`${n} of ${LIBN} prompts`};q.addEventListener('input',f);f()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-star]');if(!b)return;const n=+b.dataset.star;let my=LS.get(MK,[]);
 if(my.some(m=>m.n==n)){my=my.filter(m=>m.n!=n);b.textContent='☆ Save'}else{const p=D.library.flatMap(c=>c.prompts).find(p=>p.n==n);my.push({n,name:p.name,text:p.text,note:''});b.textContent='★ Saved'}LS.set(MK,my)});
function mine(){const my=LS.get(MK,[]);return `<div class="card"><span class="kicker">My prompts</span><h2>Your personal prompt collection</h2><p class="small">Saved only in this browser on this device. Keep the [BRACKETS] here and fill in real facts each time; don't store customer details.</p>
 ${my.length?my.map((m,i)=>`<div class="rep"><b>#${m.n} ${esc(m.name)}</b><code id="mp${i}">${hl(m.text)}</code><input type="text" data-note="${i}" value="${esc(m.note)}" placeholder="When I use it (e.g. Monday mornings)"><div class="bar"><button class="btn sec sm" data-copy="#mp${i}">Copy</button><button class="btn warn sm" data-rm="${i}">Remove</button></div></div>`).join(''):'<p>No saved prompts yet. Tap ☆ Save in the <a href="#library">library</a>.</p>'}
 ${my.length?'<button class="btn warn" id="clrm">Forget all my saved prompts</button>':''}</div>`}
function bindMine(){document.querySelectorAll('[data-note]').forEach(i=>i.addEventListener('input',()=>{const my=LS.get(MK,[]);my[+i.dataset.note].note=i.value.slice(0,120);LS.set(MK,my)}));
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const my=LS.get(MK,[]);my.splice(+b.dataset.rm,1);LS.set(MK,my);render()});
 const c=$('#clrm');if(c)c.onclick=()=>{LS.del(MK);toast('Saved prompts removed');render()}}
function profile(){const p=prof();return `<div class="card"><span class="kicker">Optional</span><h2>Your business profile</h2><p>${esc(D.profile_note)}</p>
 <label class="q" for="pb">Business description</label><input type="text" id="pb" value="${esc(p.business)}" placeholder="A family-run shoe store in Denver">
 <label class="q" for="pt">Preferred tone</label><input type="text" id="pt" value="${esc(p.tone)}" placeholder="Friendly and clear">
 <label class="q" for="pl">Preferred reply language</label>${langField({}, p.lang||'').replace('id="qv"','id="pl"')}
 <div class="bar"><button class="btn" id="psave">Save on this device</button><button class="btn warn" id="pforget">Forget my details and saved prompts</button></div><p class="small" id="pst">${Object.keys(p).length?'Details are saved on this device.':'Nothing saved.'}</p>
 <div class="tip">${esc(D.privacy)}</div></div>`}
function bindProfile(){$('#psave').onclick=()=>{const p={business:$('#pb').value.trim().slice(0,200),tone:$('#pt').value.trim().slice(0,60),lang:$('#pl').value.trim().slice(0,40)};Object.keys(p).forEach(k=>!p[k]&&delete p[k]);LS.set(PK,p);$('#pst').textContent='Saved on this device.';toast('Saved')};
 $('#pforget').onclick=()=>{LS.del(PK);LS.del(MK);['#pb','#pt','#pl'].forEach(s=>$(s).value='');$('#pst').textContent='Forgotten: your profile and saved prompts are removed from this device.';toast('Details and saved prompts forgotten')}}
function practice(){const P=D.practice;return `<div class="card"><span class="kicker">Practice</span><h2>Your 7-day challenge</h2><p>${esc(P.intro)}</p><table><tr><th>Day</th><th>Do this</th><th>Use</th></tr>${P.days.map(d=>`<tr><td>${d[0]}</td><td>${esc(d[1])}</td><td>${esc(d[2])}</td></tr>`).join('')}</table>
 <h3 style="margin-top:14px">Repairs that work for any task</h3>${D.repairs_general.map(([w,r],i)=>`<div class="rep"><b>${esc(w)}</b><code id="gr${i}">${hl(r)}</code><button class="btn sec sm" data-copy="#gr${i}">Copy</button></div>`).join('')}<div class="note">${esc(D.verify)}</div></div>`}
function end(){const X=(typeof EXTRA!=='undefined'&&EXTRA)||{};const fw=D.first_win||{};return `<div class="card"><span class="kicker">You did it</span><h2>That's a complete, checked AI task.</h2>
 <p><b>What you just did:</b> you gave the AI only confirmed facts, got a draft, and checked it before use${fw.checks?` (${fw.checks.length} checks)`:''}. That is the whole method.</p>
 <p><b>What the full guide adds:</b> ${esc(D.meta.demo_pitch)}</p>
 <div class="bar"><a class="btn" href="${BUY}">Get the full guide · USD 2.70</a>${X.guide?`<a class="btn sec" href="${X.guide}">See what's inside</a>`:''}</div>
 <p class="small">Secure checkout by Stripe. Instant access after payment.${X.support?` Not useful? Email ${esc(X.support)} within 7 days for a refund.`:''}</p>
 ${X.bundle?`<div class="tip"><b>Want every guide?</b> The All-Access Library is USD ${X.bundle_price} for every current guide plus every future release. <a href="${X.bundle}">Get All-Access →</a></div>`:''}
 <p class="small"><a href="/catalog.html">Browse the library</a></p></div>`}
const TABS=DEMO?[]:[['#start','Start'],['#fw/1','First win'],D.craft&&['#craft','C.R.A.F.T.'],['#tasks','Tasks'],LIBN&&['#library','Library'],D.practice&&['#practice','Practice'],LIBN&&['#mine','My prompts'],['#profile','Profile']].filter(Boolean);
function render(){const h=location.hash||'#start';const [r,a,b]=h.slice(1).split('/');let html='',bind=null;
 if(r=='fw')html=fw(Math.min(5,Math.max(1,+a||1)));
 else if(DEMO&&r=='end')html=end();
 else if(!DEMO&&r=='craft'&&D.craft)html=craft();
 else if(!DEMO&&r=='tasks')html=tasks();
 else if(!DEMO&&r=='t'&&T(a)){const t=T(a);if(b=='intro')html=intro(t);else if(b=='done')html=done(t);else{const i=Math.min(t.questions.length-1,Math.max(0,+b||0));html=question(t,i);bind=()=>bindQ(t,i)}}
 else if(!DEMO&&r=='library'&&LIBN){html=library();bind=bindLib}
 else if(!DEMO&&r=='mine'&&LIBN){html=mine();bind=bindMine}
 else if(!DEMO&&r=='profile'){html=profile();bind=bindProfile}
 else if(!DEMO&&r=='practice'&&D.practice)html=practice();
 else html=start();
 app.innerHTML=html;if(bind)bind();
 const tabs=$('#tabs');if(tabs)tabs.innerHTML=TABS.map(([k,l])=>`<a href="${k}" class="${('#'+r).startsWith(k.split('/')[0])&&(k!='#start'||r=='start'||!r)?'on':''}">${l}</a>`).join('');
 window.scrollTo(0,0)}
addEventListener('hashchange',render);render();
</script></body></html>
